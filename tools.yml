services:
  # ============================================================================
  # 1. GIT PROVIDER (Gitea)
  # ============================================================================
  gitea:
    image: docker.gitea.com/gitea:28.0.0
    container_name: openoxide-gitea
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "2222:22"
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__SSH_DOMAIN: localhost
      GITEA__server__SSH_PORT: 2222
    volumes:
      - gitea-data:/data

  # ============================================================================
  # 2. SECRET MANAGEMENT (HashiCorp Vault)
  # ============================================================================
  vault:
    image: hashicorp/vault:latest
    container_name: openoxide-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/data

  # ============================================================================
  # 3. OBJECT STORAGE (RustFS - S3 Compatible)
  # ============================================================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: openoxide-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: "admin"
      RUSTFS_SECRET_KEY: "password123"
      RUST_LOG: "info"
    volumes:
      - rustfs-data:/data

  # ============================================================================
  # 4. NOTIFICATIONS (ntfy)
  # ============================================================================
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: openoxide-ntfy
    restart: unless-stopped
    command: serve
    ports:
      - "8090:80"
    environment:
      NTFY_BASE_URL: "http://localhost:8090"
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-etc:/etc/ntfy

volumes:
  gitea-data:
  vault-data:
  rustfs-data:
  ntfy-cache:
  ntfy-etc:
