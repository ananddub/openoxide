# FlashORM Rust code generation only.
# Migrations are intentionally not configured here; use flash.toml for
# schema migration commands separately.
version = "2"
schema_dir = "db/schema"
queries = "db/queries/"

[database]
provider = "sqlite"
url_env = "DATABASE_URL"

[gen.rust]
enabled = true
out = "crates/db/src/flash_gen"
driver = "sqlx"
