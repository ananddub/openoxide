[package]
name = "agent"
version = "0.4.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync", "fs", "process", "signal"] }
tokio-stream = "0.1.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# Only cpu/mem/disk/network are collected; drop the default multithread
# (rayon pool), component and user features.
sysinfo = { version = "0.33.1", default-features = false, features = [
    "disk",
    "network",
    "system",
] }
dotenvy = "0.15.7"
tonic = { version = "0.12.3", features = ["transport", "tls"] }
prost = "0.13.5"
tokio-util = "0.7"
auto-di = "0.6.0"
auto_grpc = { path = "../crates/auto/grpc" }
futures = "0.3"
async-stream = "0.3"
os = { path = "../crates/os" }
sh_macros = { path = "../crates/sh_macros" }

hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
uuid = { version = "1.2.2", features = ["v4"] }
sha2 = "0.10"

[build-dependencies]
tonic-build = "0.12.3"
prost-build = "0.13.5"
protoc-bin-vendored = "3.0.0"
