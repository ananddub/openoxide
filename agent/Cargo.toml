[package]
name = "agent"
version = "0.4.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
sysinfo = "0.33.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
    "http2",
    "charset",
] }
dotenvy = "0.15.7"
tonic = "0.12.3"
prost = "0.13.5"
tokio-util = "0.7"
os = { path = "../crates/os" }
sh_macros = { path = "../crates/sh_macros" }

hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"

[build-dependencies]
tonic-build = "0.12.3"
prost-build = "0.13.5"
protoc-bin-vendored = "3.0.0"
