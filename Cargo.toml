[package]
name = "rustploy"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/html/rt",
    "crates/html/macro",
    "crates/auto/route_macros",
    "crates/auto/route",
    "crates/auto/socket_macros",
    "crates/auto/socket",
    "crates/sh_macros",
    "crates/os",
    "agent",
]


[dependencies]
html-rt    = { path = "crates/html/rt", features = ["axum"] }
html-macro = { path = "crates/html/macro" }
tokio = { version = "1", features = ["full"] }

auto-di = "0.6.0"
auto_route = { version = "0.2.1", path = "crates/auto/route" }
sh_macros = { path = "crates/sh_macros" }
os = { path = "crates/os" }
auto_socket = { version = "0.1.0", path = "crates/auto/socket" }
serde = { version = "1.0", features = ["derive"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
serde_json = "1.0"
serde_yaml = "0.9"
validator = { version = "0.20", features = ["derive"] }
axum = { version = "0.8.9", features = ["multipart", "macros"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "sqlite-preupdate-hook", "macros", "migrate", "chrono", "uuid", "json"] }
sqlx-gen = { version = "0.5.8", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
argon2 = { version = "0.6.0-rc.8", features = ["getrandom"] }
bcrypt = "0.17"
tracing = "0.1.44"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
socketioxide = "0.18.4"
zeroize = "1.9.0"
# Pure-Rust SSH keypair generation. Replaces shelling out to ssh-keygen, which
# wrote the private key to a temp file before we could read it back.
ssh-key = { version = "0.7.0-rc.11", features = ["ed25519", "rsa", "rand_core"] }
getrandom = "0.3"
libc = "0.2"
tracing-subscriber = "0.3.23"
uuid = { version = "1.2.2", features = ["v4", "serde"] }
sha2 = "0.10"
hmac = "0.12"
dashmap = "6.2.1"
moka = { version = "0.12", features = ["future"] }
dotenvy = "0.15.7"
poem-openapi = "5.1.16"
tower-http = { version = "0.7", features = ["cors"] }
futures = "0.3.32"
thiserror = "2.0.18"
tempfile = "3.27.0"
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = "0.7.11"
tokio-cron-scheduler = "0.13"
croner = "2.2"
paste = "1.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "form", "rustls-no-provider"] }
rig-core = { version = "0.41.0", default-features = false, features = ["derive", "reqwest"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
totp-rs = { version = "5.6", features = ["gen_secret", "otpauth"] }
notify = "8.1.0"
minijinja = "2.21.0"
tonic = "0.12.3"
prost = "0.13.5"
pty-process = { version = "0.5.3", features = ["async", "tokio"] }
ipnet = "2.12"
base64 = "0.22"

[build-dependencies]
tonic-build = "0.12.3"
prost-build = "0.13.5"
protoc-bin-vendored = "3.0.0"

[profile.release]
opt-level = "z"        # size ke liye optimize (speed ke liye "3" use karo)
lto = true             # Link Time Optimization — dead code remove karta hai
codegen-units = 1      # better optimization, slow compile
panic = "abort"        # unwinding code hata deta hai
strip = true           # debug symbols binary se remove karta hai
