# Standalone OpenOxide Agent. Runs one per host, independently of the panel.
#
# Set SERVER_ID to the panel's id for this host, and METRICS_TOKEN to the same
# secret the panel expects, before starting.

services:
  openoxide-agent:
    # Pulls the published image by default. Use `--build` to run local changes.
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: dubeyanand/openoxide-agent:${AGENT_TAG:-latest}
    pull_policy: always
    container_name: openoxide-agent
    restart: unless-stopped
    # Local panel and agent share a private Docker network. The panel reaches
    # this service at openoxide-agent:50051.
    networks:
      - openoxide-network
    volumes:
      # The agent is the host Docker executor for monitoring, compose,
      # deployment, backup and maintenance tasks. Keep this mount read-write;
      # Docker authorizes operations through the socket itself.
      - /var/run/docker.sock:/var/run/docker.sock
      # cgroup mode reads container metrics from here. Without this mount the
      # agent falls back to the streaming collector.
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      # Persistent task workspace for repositories, compose files and backup
      # staging. Remote agents use their own host-local volume.
      - agent_workspace:/app/workspace
      # Traefik static/dynamic configuration and certificates. The agent owns
      # host-side route updates, so this mount must remain read-write.
      - /etc/openoxide/traefik:/etc/openoxide/traefik
      # Server certificate and private key signed by the CA trusted by panel.
      # - ./agent-tls:/etc/openoxide/agent-tls:ro
    environment:
      # Must match an existing row in the panel's `servers` table.
      # -1 is the local-Agent sentinel. The panel maps it to its actual local
      # server row, so development databases do not need a hard-coded id.
      SERVER_ID: "${OPENOXIDE_LOCAL_SERVER_ID:--1}"
      MONITOR_DATABASE_URL: "memory://metrics"
      GRPC_PORT: "50051"
      REFRESH_RATE: "2"
      RETENTION_DAYS: "7"
      OPENOXIDE_SERVER_URL: "http://openoxide:4000"
      METRICS_TOKEN: "${METRICS_TOKEN:-change_me_metrics_token}"
      # AGENT_TLS_CERT: "/etc/openoxide/agent-tls/server.crt"
      # AGENT_TLS_KEY: "/etc/openoxide/agent-tls/server.key"
      RUST_LOG: "agent=info"
      # cgroup (default) reads /sys/fs/cgroup directly and scales to thousands
      # of containers. Set to "stream" for per-second freshness and network I/O
      # on hosts with only a handful of containers.
      COLLECTION_MODE: "auto"
      # Narrow what gets collected on a busy host. Patterns are exact unless
      # they use *, so "*buildkit*" is needed to match "openoxide_buildkit".
      # INCLUDE_CONTAINERS: "prod-*"
      # EXCLUDE_CONTAINERS: "*buildkit*"
      # Samples per stored row. 1 stores everything; raise it on dense hosts to
      # store only an average + peak per window (300 = 5 min at a 60s cadence).
      ROLLUP_SAMPLES: "1"

volumes:
  agent_workspace:

networks:
  openoxide-network:
    external: true
