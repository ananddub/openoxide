[package]
name = "sh_macros"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Procedural macros that compile shell-style command scripts into a typed command IR"
keywords = ["macros", "shell", "proc-macro"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
regex = "1.0"
