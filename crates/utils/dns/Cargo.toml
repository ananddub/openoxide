[package]
name = "dns"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Managed DNS provider clients: one trait, one thin client per provider"

[dependencies]
async-trait = "0.1"
aws-credential-types = "1.2"
aws-sdk-route53 = "1.76"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "form", "rustls-no-provider"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
thiserror = "2.0.18"

[dev-dependencies]
# `reqwest` is built with `rustls-no-provider` (see the note in `http.rs`), and it refuses to
# construct even an HTTP-only client until a provider is installed. The panel does that in
# `main.rs`; a test binary installs ring here, with the same features the panel uses.
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
