[package]
name = "sqlite_realtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Change-notify bridge between SQLite databases and async Rust consumers"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }

[build-dependencies]
cc = "1.0"
