[package]
name = "oxos"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "System operations toolkit: local and remote command execution, Docker/Git/rsync/rclone drivers, archives, SSH and network configuration"
keywords = ["ops", "ssh", "docker", "exec"]

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
poem-openapi = "5.1.16"
tracing = "0.1.44"
ssh-key = { version = "0.7.0-rc.11", features = ["ed25519", "rsa", "rand_core"] }
tokio-util = "0.7.11"
thiserror = "2.0.18"
tempfile = "3.27.0"
ipnet = "2.12"
libc = "0.2"
getrandom = "0.3"
zeroize = "1.9.0"
base64 = "0.22"
uuid = { version = "1.2.2", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
sh_macros = { version = "0.1.0", path = "../sh_macros" }
async-trait = "0.1"
russh = "0.45"
russh-keys = "0.45"
