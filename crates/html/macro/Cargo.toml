[package]
name = "html-macro"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
html-rt = { path = "../rt" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
html-rt = { path = "../rt", features = ["axum"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
