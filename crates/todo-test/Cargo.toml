[package]
name = "rustploy-todo-test"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
auto-di = "0.6.0"
auto_route = { path = "../auto/route" }
futures = "0.3.32"
html-macro = { path = "../html/macro" }
html-rt = { path = "../html/rt", features = ["axum"] }
poem-openapi = "5.1.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "sqlite-preupdate-hook", "macros"] }
tokio = { version = "1", features = ["full"] }
