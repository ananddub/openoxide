version: v2
# Dart gRPC stubs for the mobile client. Run from the repo root via `make -C mobile gen`.
# `--path proto/openoxide/api/v1` is the same selector the web client uses
# (web/openoxide_react/package.json "gen:connect"), so proto/agent.proto and
# proto/buf/** are excluded by construction.
clean: true
plugins:
  - local: protoc-gen-dart
    out: mobile/lib/src/gen
    opt: grpc
