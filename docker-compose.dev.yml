# Full local stack: panel (openoxide, embeds the dashboard SPA) + agent.
# One command up, one command down — see justfile `up` / `down`.
#
# The panel image builds both the Rust binary and the React SPA inside the
# Docker build (musl + bun), so nothing needs to be pre-built on the host.

services:
  openoxide:
    build:
      context: .
      dockerfile: Dockerfile
    image: dubeyanand/openoxide:dev
    pull_policy: never
    container_name: openoxide
    restart: unless-stopped

    ports:
      - "4000:4000"
      - "51820:51820/udp"

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      # Panel database + runtime data (backups, logs, traefik config, etc.)
      - openoxide_data:/app/data
      # Host Kernel Modules (Required for WireGuard interface creation)
      - /lib/modules:/lib/modules:ro
      # Docker socket for local agent lifecycle control (start/stop the
      # openoxide-agent container when its gRPC channel is down). Deployments
      # still go through the agent; this mount only enables recovery.
      - /var/run/docker.sock:/var/run/docker.sock
      # Deployment/application logs — persists across container rebuilds
      # (otherwise every rebuild wipes deploy logs)
      - openoxide_logs:/etc/openoxide/logs
      # TLS certificates for the h2-only HTTPS listener (mkcert dev certs:
      # set TLS_CERT_PATH/TLS_KEY_PATH/MKCERT_CAROOT in .env to host paths)
      - ${TLS_CERT_PATH:-./certs/cert.pem}:/app/certs/cert.pem:ro
      - ${TLS_KEY_PATH:-./certs/key.pem}:/app/certs/key.pem:ro
      # Web-only fast path: the panel serves the SPA from this volume
      # (see src/api/dashboard.rs WEB_DIST_OVERRIDE). `just web-deploy`
      # builds on the host and docker-cp's the bundle in — no Rust
      # recompile, no image build. (A direct bind mount of the repo's
      # dist dir is denied by Docker Desktop file sharing on this setup.)
      - openoxide_web_dist:/app/web-dist

    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      DATABASE_URL: "sqlite:///app/data/db.sqlite3"
      MALLOC_ARENA_MAX: "2"
      RUST_BACKTRACE: "1"

      # ── Secrets — dev defaults, override via .env ──────────────────────────
      SECRET_KEY: "${SECRET_KEY:-change_me_in_production}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-change_me_jwt_access}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-change_me_jwt_refresh}"
      METRICS_TOKEN: "${METRICS_TOKEN:-change_me_metrics_token}"
      OPENOXIDE_LOCAL_SERVER_ID: "${OPENOXIDE_LOCAL_SERVER_ID:-0}"
      OPENOXIDE_SERVER_URL: "https://openoxide:4000"

      SOCKET_PATH: "/var/run/docker.sock"
      BUILD_MEMORY_LIMIT: "8G"
      BUILD_CPU_LIMIT: "8"
      TOKIO_WORKER_THREADS: "4"
      RUST_LOG: "openoxide=info"
      TLS_CERT_PATH: "/app/certs/cert.pem"
      TLS_KEY_PATH: "/app/certs/key.pem"

    networks:
      - openoxide-network

    depends_on:
      openoxide-agent:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 512M

  openoxide-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: dubeyanand/openoxide-agent:dev
    pull_policy: never
    container_name: openoxide-agent
    restart: unless-stopped
    # The agent shells out to the docker CLI, whose plugin grandchildren re-parent
    # to PID 1 when the shell exits. init gives the container a zombie reaper.
    init: true

    networks:
      - openoxide-network

    volumes:
      # The agent is the host Docker executor for monitoring, compose,
      # deployment, backup and maintenance tasks.
      - /var/run/docker.sock:/var/run/docker.sock
      # cgroup mode reads container metrics from here.
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      # Persistent task workspace for repositories, compose files and backup
      # staging. Remote agents use their own host-local volume.
      - agent_workspace:/app/workspace
      # Traefik static/dynamic configuration and certificates. The agent owns
      # host-side route updates, so this mount must remain read-write.
      - /etc/openoxide/traefik:/etc/openoxide/traefik

    environment:
      # -1 is the local-Agent sentinel; the panel maps it to its actual local
      # server row, so dev databases do not need a hard-coded id.
      SERVER_ID: "-1"
      GRPC_PORT: "50051"
      OPENOXIDE_SERVER_URL: "http://openoxide:4000"
      METRICS_TOKEN: "${METRICS_TOKEN:-change_me_metrics_token}"
      RUST_LOG: "agent=info"

  # The dashboard is embedded in the panel binary (rust-embed) and served
  # over the panel's h2-only HTTPS listener on :4000 — no standalone web
  # container exists anymore.

volumes:
  openoxide_data:
  openoxide_logs:
  agent_workspace:
  openoxide_web_dist:

networks:
  openoxide-network:
    name: openoxide-network
    external: true
