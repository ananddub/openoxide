[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
# Host builds are capped at 8 jobs so cargo does not starve the desktop.
# The Dockerfiles also set CARGO_BUILD_JOBS=8 for their cpu.max quota.
[build]
jobs = 8

[alias]
check-fast = "check -p openoxide"
check-all = "check --workspace --all-targets"
run-fast = "run --profile release-fast --bin openoxide"
build-fast = "build --profile release-fast --bin openoxide"
build-prod = "build --release --bin openoxide"
build-size = "build --profile release-size --bin openoxide"
