syntax = "proto3";

package agent;

// Query API the panel uses to read metrics collected by an agent.
//
// Agents are the only durable metric store. The panel authenticates to this
// query API and proxies results to authorized browser clients. Both sides
// are built and deployed together from this repository, so the wire format
// is versioned only to reject stale agents after a panel upgrade
// (protocol_version).
service AgentService {
  rpc GetAgentInfo(AgentInfoRequest) returns (AgentInfoResponse);
  // Query historical server metrics. Host-static facts (cpu model, os, ...)
  // ride once in `host`; points carry only the per-sample values.
  rpc GetServerMetrics(GetMetricsRequest) returns (ServerMetricsResponse);

  // Query historical container metrics
  rpc GetContainerMetrics(GetContainerMetricsRequest) returns (ContainerMetricsResponse);

  // Current Docker lifecycle state, including stopped/restarting containers.
  rpc GetContainerStates(GetMetricsRequest) returns (ContainerStatesResponse);

  // Docker lifecycle snapshots, pushed whenever container state changes.
  rpc WatchContainerStates(WatchRequest) returns (stream ContainerStatesResponse);

  // Persistent host or Docker shell session.
  rpc Shell(stream ShellMessage) returns (stream ShellMessage);

  // One-shot non-PTY command execution for deployment and maintenance tasks.
  rpc ExecTask(ExecTaskRequest) returns (stream ExecTaskOutput);

  // Live per-container stats streamed over the agent's own Docker API
  // connection, one `docker stats --format {{json .}}`-shaped JSON document
  // per frame. Replaces the panel spawning a `docker stats` CLI process
  // (~11 MB RSS each) per browser consumer. Empty container_ids means every
  // running container; stream=false sends one sample per container and ends.
  rpc StreamContainerStats(StreamStatsRequest) returns (stream StatsFrame);

  // Stream a host file to the agent and atomically install it at destination.
  // The first message must carry the header; the rest are raw data chunks
  // whose running byte count is checked against header.total_size.
  rpc UploadFile(stream FileUploadMessage) returns (FileUploadResult);
}

message AgentInfoRequest {
  int64 server_id = 1;
}

message AgentInfoResponse {
  string protocol_version = 1;
  string agent_version = 2;
  repeated string capabilities = 3;
  uint64 max_upload_bytes = 4;
  repeated string upload_roots = 5;
}

message FileUploadMessage {
  oneof message {
    FileUploadHeader header = 1;
    bytes data = 2;
  }
}

message FileUploadHeader {
  int64 server_id = 1;
  string destination = 2;
  uint64 total_size = 3;
  string checksum_sha256 = 4;
}

message FileUploadResult {
  uint64 bytes_written = 1;
  string destination = 2;
}

message ExecTaskRequest {
  int64 server_id = 1;
  string container = 2;
  string command = 3;
  string working_directory = 4;
  uint32 timeout_seconds = 5;
  bytes stdin = 6;
}

message ExecTaskOutput {
  ExecTaskOutputKind kind = 1;
  bytes data = 2;
  int32 exit_code = 3;
  string error = 4;
}

enum ExecTaskOutputKind {
  EXEC_TASK_OUTPUT_UNSPECIFIED = 0;
  EXEC_TASK_OUTPUT_STDOUT = 1;
  EXEC_TASK_OUTPUT_STDERR = 2;
  EXEC_TASK_OUTPUT_EXIT = 3;
  EXEC_TASK_OUTPUT_ERROR = 4;
}

message WatchRequest {
  int64 server_id = 1;
}

// Per-sample server metrics. Timestamps are unix seconds; host-static facts
// live in ServerMetricsResponse.host.
message ServerMetricPoint {
  int64 timestamp = 1;
  double cpu = 2;
  double mem_used_gb = 3;
  double mem_total_gb = 4;
  double disk_used_gb = 5;
  double disk_total_gb = 6;
  double network_in = 7;
  double network_out = 8;
  uint64 uptime = 9;
}

// Host facts that change only on reboot/upgrade. Sent once per response.
message HostInfo {
  string cpu_model = 1;
  int32 cpu_cores = 2;
  int32 cpu_physical_cores = 3;
  double cpu_speed = 4;
  string os = 5;
  string distro = 6;
  string kernel = 7;
  string arch = 8;
}

message ServerMetricsResponse {
  HostInfo host = 1;
  repeated ServerMetricPoint metrics = 2;
}

message ContainerMetricPoint {
  int64 id = 1;
  int64 timestamp = 2;
  string container_id = 3;
  string name = 4;
  double cpu_perc = 5;
  double mem_perc = 6;
  double mem_used_mb = 7;
  double mem_total_mb = 8;
  double net_in_mb = 9;
  double net_out_mb = 10;
  double block_read_mb = 11;
  double block_write_mb = 12;
  int64 application_id = 13;
  int64 compose_id = 14;
}

message GetMetricsRequest {
  int64 server_id = 1;
  int32 limit = 2;
}

message GetContainerMetricsRequest {
  int64 server_id = 1;
  string app_name = 2;
  int32 limit = 3;
}

message ContainerMetricsResponse {
  repeated ContainerMetricPoint metrics = 1;
}

message ContainerStatePoint {
  string container_id = 1;
  string name = 2;
  string state = 3;
  string status = 4;
  int64 application_id = 5;
  int64 compose_id = 6;
  string compose_project = 7;
  string compose_service = 8;
}

message ContainerStatesResponse {
  repeated ContainerStatePoint containers = 1;
}

message ShellMessage {
  oneof payload {
    ShellOpen open = 1;
    ShellInput input = 2;
    ShellResize resize = 3;
    ShellClose close = 4;
    ShellOutput stdout = 5;
    ShellOutput stderr = 6;
    ShellExit exit = 7;
    ShellError error = 8;
  }
}

// Client → agent: start a session (first message on the stream).
message ShellOpen {
  int64 server_id = 1;
  string container = 2;
  string shell = 3;
  uint32 cols = 4;
  uint32 rows = 5;
  // Escape to the host: the agent starts a privileged helper container
  // (host root bind + host PID namespace) and chroots into it.
  bool host = 6;
}

// Client → agent: PTY stdin bytes.
message ShellInput {
  bytes data = 1;
}

// Client → agent: PTY resize.
message ShellResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// Client → agent: end the session.
message ShellClose {}

// Agent → client: PTY output bytes.
message ShellOutput {
  bytes data = 1;
}

// Agent → client: session ended.
message ShellExit {
  int32 exit_code = 1;
}

// Agent → client: failure before/while running the session.
message ShellError {
  string message = 1;
}

message StreamStatsRequest {
  int64 server_id = 1;
  repeated string container_ids = 2;
  bool stream = 3;
}

// One newline-terminated JSON stats document, CLI-shaped so panel-side
// parsers do not change.
message StatsFrame {
  string json_line = 1;
}
