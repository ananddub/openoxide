syntax = "proto3";
package openoxide.api.v1;
import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

service IncomingWebhookService { rpc HandleWebhook(IncomingWebhookRequest) returns (OperationResult); }
message IncomingWebhookRequest {
  string provider = 1 [(buf.validate.field).string = {in: ["github", "gitlab", "gitea", "bitbucket"]}];
  int64 provider_id = 2 [(buf.validate.field).int64.gt = 0];
  string payload = 3 [(buf.validate.field).string = {min_len: 1, max_len: 10485760}];
  string signature = 4 [(buf.validate.field).string.max_len = 1024];
}
