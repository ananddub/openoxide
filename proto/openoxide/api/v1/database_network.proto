syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

service DatabaseNetworkService {
  // List all database networks. No params.
  rpc ListNetworks(DatabaseNetworkListNetworksRequest) returns (DatabaseNetworkListNetworksResponse);
  // List database networks scoped to server_id.
  rpc ListServerNetworks(DatabaseNetworkListServerNetworksRequest) returns (DatabaseNetworkListServerNetworksResponse);
  // Get one database network by id.
  rpc GetNetwork(DatabaseNetworkGetNetworkRequest) returns (DatabaseNetworkGetNetworkResponse);
  // Create a database network. Required: name, docker_network_name; optional description, external (0/1), server_id.
  rpc CreateNetwork(DatabaseNetworkCreateNetworkRequest) returns (DatabaseNetworkCreateNetworkResponse);
  // Update a database network by id; absent fields keep stored values (name, docker_network_name, description, external, server_id).
  rpc UpdateNetwork(DatabaseNetworkUpdateNetworkRequest) returns (DatabaseNetworkUpdateNetworkResponse);
  // Delete a database network by id.
  rpc DeleteNetwork(DatabaseNetworkDeleteNetworkRequest) returns (Empty);
  // List dependent resource counts (applications, compose services, databases) for a network by id.
  rpc ListDependencies(DatabaseNetworkListDependenciesRequest) returns (DatabaseNetworkListDependenciesResponse);
}

message DatabaseNetwork {
  int64 id = 1;
  string name = 2;
  string docker_network_name = 3;
  optional string description = 4;
  // Docker external-network flag stored as an integer (0/1) column.
  int64 external = 5;
  optional int64 server_id = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message DatabaseNetworkDependencies {
  int64 applications = 1;
  int64 compose_services = 2;
  int64 databases = 3;
}

message DatabaseNetworkListNetworksRequest {}

message DatabaseNetworkListNetworksResponse {
  repeated DatabaseNetwork networks = 1;
}

message DatabaseNetworkListServerNetworksRequest {
  int64 server_id = 1 [(buf.validate.field).int64.gt = 0];
}

message DatabaseNetworkListServerNetworksResponse {
  repeated DatabaseNetwork networks = 1;
}

message DatabaseNetworkGetNetworkRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DatabaseNetworkGetNetworkResponse {
  DatabaseNetwork network = 1;
}

message DatabaseNetworkCreateNetworkRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string docker_network_name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  optional string description = 3;
  optional int64 external = 4;
  optional int64 server_id = 5 [(buf.validate.field).int64.gt = 0];
}

message DatabaseNetworkCreateNetworkResponse {
  DatabaseNetwork network = 1;
}

message DatabaseNetworkUpdateNetworkRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string name = 2 [(buf.validate.field).string.max_len = 255];
  optional string docker_network_name = 3 [(buf.validate.field).string.max_len = 255];
  optional string description = 4;
  optional int64 external = 5;
  optional int64 server_id = 6;
}

message DatabaseNetworkUpdateNetworkResponse {
  DatabaseNetwork network = 1;
}

message DatabaseNetworkDeleteNetworkRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DatabaseNetworkListDependenciesRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DatabaseNetworkListDependenciesResponse {
  DatabaseNetworkDependencies dependencies = 1;
}
