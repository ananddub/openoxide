  WATCHED_TABLE_SERVER_MIGRATIONS = 48;
  WATCHED_TABLE_SERVER_PRIVATE_NETWORKS = 49;
  WATCHED_TABLE_SERVERS = 50;
  WATCHED_TABLE_SERVICE_APPLICATION = 51;
  WATCHED_TABLE_SERVICE_COMPOSE = 52;
  WATCHED_TABLE_SERVICE_DATABASE = 53;
  WATCHED_TABLE_SERVICE_GIT = 54;
  WATCHED_TABLE_SERVICES = 55;
  WATCHED_TABLE_SETTINGS = 56;
