syntax = "proto3";
package openoxide.api.v1;

import "buf/validate/validate.proto";

service SystemService {
  // Report overall system health (database and Docker dependencies).
  rpc Health(SystemHealthRequest) returns (SystemHealthResponse);
  // Validate the panel configuration and report errors/warnings.
  rpc TestConfig(SystemTestConfigRequest) returns (SystemTestConfigResponse);
}

message SystemHealthRequest {}

// success means every dependency (database, docker) is healthy; message summarises unhealthy ones.
message SystemHealthResponse {
  bool success = 1;
  optional string message = 2 [(buf.validate.field).string.max_len = 4096];
}

message SystemTestConfigRequest {}

// success means no configuration errors; warnings are informational and surface through message only.
message SystemTestConfigResponse {
  bool success = 1;
  optional string message = 2 [(buf.validate.field).string.max_len = 4096];
}
