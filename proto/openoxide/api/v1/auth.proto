syntax = "proto3";

package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

service AuthService {
  // @internal Register the first/owner user. Required: email, password (min 8); first_name/last_name/avatar optional. Returns user + tokens.
  rpc Signup(SignupRequest) returns (AuthResponse);
  // @internal Log in with credentials. Required: email, password; two_factor_code/recovery_code when 2FA enabled. Returns user + tokens.
  rpc Login(LoginRequest) returns (AuthResponse);
  // @internal Exchange a refresh token for new tokens. Required: refresh_token.
  rpc Refresh(RefreshRequest) returns (AuthResponse);
  // @internal Return the currently authenticated user. No params.
  rpc WhoAmI(WhoAmIRequest) returns (User);
  // @internal Log out the current session. No params.
  rpc Logout(LogoutRequest) returns (Empty);
  // @internal Report whether an owner account exists yet (initial setup gate). No params.
  rpc GetSetupStatus(GetSetupStatusRequest) returns (SetupStatus);
  // @internal Update the current user's profile. All fields optional: email, password (min 8), first_name, last_name, avatar; current_password is required when email or password changes.
  rpc UpdateUser(UpdateUserRequest) returns (User);

  // @internal Request a password-reset email. Required: email.
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (Empty);
  // @internal Reset a password using a reset token. Required: token, password (min 8).
  rpc ResetPassword(ResetPasswordRequest) returns (Empty);

  // @internal Report the current user's email verification status. No params.
  rpc GetEmailVerificationStatus(GetEmailVerificationStatusRequest) returns (EmailVerificationStatus);
  // @internal Send an email-verification message to the current user. No params.
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (Empty);
  // @internal Confirm email verification using a token. Required: token.
  rpc ConfirmEmailVerification(ConfirmEmailVerificationRequest) returns (Empty);

  // @internal Report the current user's 2FA status (enabled/configured). No params.
  rpc GetTwoFactorStatus(GetTwoFactorStatusRequest) returns (TwoFactorStatus);
  // @internal Begin 2FA setup, returning secret/otpauth URL/recovery codes. Required: password.
  rpc SetupTwoFactor(SetupTwoFactorRequest) returns (TwoFactorSetup);
  // @internal Enable 2FA by confirming a TOTP code. Required: code (6-10 chars).
  rpc EnableTwoFactor(EnableTwoFactorRequest) returns (Empty);
  // @internal Disable 2FA. Required: password, code (6-10 chars).
  rpc DisableTwoFactor(DisableTwoFactorRequest) returns (Empty);
  // @internal Regenerate 2FA recovery codes. Required: password, code (6-10 chars). Returns new codes.
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RecoveryCodes);

  // @internal List the current user's active sessions. No params.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // @internal Revoke a session by id. Required: session_id.
  rpc RevokeSession(RevokeSessionRequest) returns (Empty);

  // @internal List the current user's personal access tokens. No params.
  rpc ListPersonalAccessTokens(ListPersonalAccessTokensRequest) returns (ListPersonalAccessTokensResponse);
  // @internal Create a personal access token (returned once). Required: name, password; expires_at optional.
  rpc CreatePersonalAccessToken(CreatePersonalAccessTokenRequest) returns (CreatedPersonalAccessToken);
  // @internal Revoke a personal access token by id. Required: id.
  rpc RevokePersonalAccessToken(RevokePersonalAccessTokenRequest) returns (Empty);
}

message SignupRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 8];
  optional string first_name = 3;
  optional string last_name = 4;
  optional string avatar = 5;
}

message LoginRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 1];
  optional string two_factor_code = 3;
  optional string recovery_code = 4;
}

message RefreshRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message AuthResponse {
  User user = 1;
  TokenPair tokens = 2;
}

message WhoAmIRequest {}
message LogoutRequest {}
message GetSetupStatusRequest {}

message SetupStatus {
  bool owner_present = 1;
}

message UpdateUserRequest {
  optional string email = 1 [(buf.validate.field).string.email = true];
  optional string password = 2 [(buf.validate.field).string.min_len = 8];
  optional string first_name = 3 [(buf.validate.field).string.max_len = 255];
  optional string last_name = 4 [(buf.validate.field).string.max_len = 255];
  optional string avatar = 5 [(buf.validate.field).string.uri = true];
  optional string current_password = 6 [(buf.validate.field).string.min_len = 1];
}

message RequestPasswordResetRequest {
  string email = 1 [(buf.validate.field).string.email = true];
}

message ResetPasswordRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
  string password = 2 [(buf.validate.field).string.min_len = 8];
}

message GetEmailVerificationStatusRequest {}
message RequestEmailVerificationRequest {}

message ConfirmEmailVerificationRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
}

message EmailVerificationStatus {
  bool verified = 1;
  optional int64 verified_at = 2;
}

message GetTwoFactorStatusRequest {}

message TwoFactorStatus {
  bool enabled = 1;
  bool configured = 2;
}

message SetupTwoFactorRequest {
  string password = 1 [(buf.validate.field).string.min_len = 1];
}

message TwoFactorSetup {
  string secret = 1;
  string otpauth_url = 2;
  repeated string recovery_codes = 3;
}

message EnableTwoFactorRequest {
  string code = 1 [(buf.validate.field).string = {min_len: 6, max_len: 10}];
}

message DisableTwoFactorRequest {
  string password = 1 [(buf.validate.field).string.min_len = 1];
  string code = 2 [(buf.validate.field).string = {min_len: 6, max_len: 10}];
}

message RegenerateRecoveryCodesRequest {
  string password = 1 [(buf.validate.field).string.min_len = 1];
  string code = 2 [(buf.validate.field).string = {min_len: 6, max_len: 10}];
}

message RecoveryCodes {
  repeated string recovery_codes = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated AuthSession sessions = 1;
}

message AuthSession {
  string session_id = 1;
  int64 created_at = 2;
  optional int64 expires_at = 3;
  bool active = 4;
  bool current = 5;
}

message RevokeSessionRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListPersonalAccessTokensRequest {}

message ListPersonalAccessTokensResponse {
  repeated PersonalAccessToken tokens = 1;
}

message CreatePersonalAccessTokenRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string password = 2 [(buf.validate.field).string.min_len = 1];
  optional int64 expires_at = 3;
}

message PersonalAccessToken {
  int64 id = 1;
  string name = 2;
  string token_prefix = 3;
  optional int64 expires_at = 4;
  optional int64 last_used_at = 5;
  optional int64 revoked_at = 6;
  int64 created_at = 7;
}

message CreatedPersonalAccessToken {
  string token = 1;
  PersonalAccessToken details = 2;
}

message RevokePersonalAccessTokenRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}
