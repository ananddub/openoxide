syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";

service ScheduleService {
  rpc ListSchedules(ResourceQuery) returns (ResourceListResponse);
  rpc GetSchedule(ResourceRequest) returns (ResourceResponse);
  rpc CreateSchedule(ResourceRequest) returns (ResourceResponse);
  rpc UpdateSchedule(ResourceRequest) returns (ResourceResponse);
  rpc DeleteSchedule(ResourceRequest) returns (Empty);
  rpc RunSchedule(ResourceRequest) returns (OperationResult);
  rpc PauseSchedule(ResourceRequest) returns (OperationResult);
  rpc ResumeSchedule(ResourceRequest) returns (OperationResult);
}
