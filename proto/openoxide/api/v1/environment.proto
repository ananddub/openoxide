syntax = "proto3";

package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

service EnvironmentService {
  rpc GetEnvironment(GetEnvironmentRequest) returns (Environment);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  rpc StreamGetEnvironment(GetEnvironmentRequest) returns (stream Environment);
  rpc StreamListEnvironments(ListEnvironmentsRequest) returns (stream ListEnvironmentsResponse);
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (Environment);
  rpc UpdateEnvironment(UpdateEnvironmentRequest) returns (Environment);
  rpc SetDefaultEnvironment(SetDefaultEnvironmentRequest) returns (Environment);
  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (Empty);
}

message Environment {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string name = 2;
  optional string description = 3;
  string environment_variables = 4;
  bool is_default = 5;
  int64 project_id = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message GetEnvironmentRequest {
  int64 id = 1;
}

message ListEnvironmentsRequest {
  int64 project_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ListEnvironmentsResponse {
  repeated Environment environments = 1;
}

message CreateEnvironmentRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  optional string description = 2;
  string environment_variables = 3;
  bool is_default = 4;
  int64 project_id = 5 [(buf.validate.field).int64.gt = 0];
}

message UpdateEnvironmentRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string name = 2;
  optional string description = 3;
  optional string environment_variables = 4;
  optional bool is_default = 5;
}

message SetDefaultEnvironmentRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteEnvironmentRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}
