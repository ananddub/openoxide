syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";

service TraefikService {
  rpc ListFiles(ResourceQuery) returns (ResourceListResponse);
  rpc GetFileTree(ResourceQuery) returns (ResourceListResponse);
  rpc GetFileContent(ResourceRequest) returns (ResourceResponse);
  rpc UpdateFileContent(ResourceRequest) returns (OperationResult);
  rpc Health(Empty) returns (OperationResult);
  rpc GetRequestStatus(Empty) returns (OperationResult);
  rpc ToggleRequests(ResourceRequest) returns (OperationResult);
  rpc GetRequestLogs(ResourceQuery) returns (ResourceListResponse);
  rpc GetVersion(Empty) returns (ResourceResponse);
  rpc UpdateVersion(ResourceRequest) returns (OperationResult);
  rpc RenderMiddleware(ResourceRequest) returns (ResourceResponse);
}
