syntax = "proto3";
package openoxide.api.v1;

import "buf/validate/validate.proto";

// Singleton panel settings row.
service SettingsService {
  rpc GetSettings(SettingsGetSettingsRequest) returns (SettingsGetSettingsResponse);
  rpc UpdateSettings(SettingsUpdateSettingsRequest) returns (SettingsUpdateSettingsResponse);
}

// Traefik certificate resolution mode (SettingsCertificateTypeDto).
enum SettingsCertificateType {
  SETTINGS_CERTIFICATE_TYPE_UNSPECIFIED = 0;
  SETTINGS_CERTIFICATE_TYPE_NONE = 1;
  SETTINGS_CERTIFICATE_TYPE_LETSENCRYPT = 2;
  SETTINGS_CERTIFICATE_TYPE_CUSTOM = 3;
}

message Settings {
  int64 id = 1;
  optional string server_ip = 2;
  SettingsCertificateType certificate_type = 3;
  optional string custom_cert_resolver = 4;
  bool https = 5;
  optional string host = 6;
  optional string lets_encrypt_email = 7;
  bool enable_docker_cleanup = 8;
  optional string log_cleanup_cron = 9;
  // Metrics scrape configuration as an opaque JSON document ("{}" default).
  string metrics_config = 10;
  string panel_backup_cron = 11;
  int64 log_retention_days = 12;
  bool panel_backup_enabled = 13;
  bool log_cleanup_enabled = 14;
  int64 updated_at = 15;
}

message SettingsGetSettingsRequest {}

message SettingsGetSettingsResponse {
  Settings settings = 1;
}

// Patch semantics: an absent field keeps its stored value.
message SettingsUpdateSettingsRequest {
  optional string server_ip = 1;
  optional SettingsCertificateType certificate_type = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional string custom_cert_resolver = 3;
  optional bool https = 4;
  optional string host = 5;
  optional string lets_encrypt_email = 6;
  optional bool enable_docker_cleanup = 7;
  optional string log_cleanup_cron = 8;
  optional string metrics_config = 9 [(buf.validate.field).string.max_len = 1048576];
  optional string panel_backup_cron = 10;
  optional int64 log_retention_days = 11 [(buf.validate.field).int64.gte = 0];
  optional bool panel_backup_enabled = 12;
  optional bool log_cleanup_enabled = 13;
}

message SettingsUpdateSettingsResponse {
  Settings settings = 1;
}
