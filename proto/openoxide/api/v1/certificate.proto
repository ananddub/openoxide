syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";

service CertificateService {
  rpc ListCertificates(ResourceQuery) returns (ResourceListResponse);
  rpc GetCertificate(ResourceRequest) returns (ResourceResponse);
  rpc CreateCertificate(ResourceRequest) returns (ResourceResponse);
  rpc UpdateCertificate(ResourceRequest) returns (ResourceResponse);
  rpc DeleteCertificate(ResourceRequest) returns (Empty);
  rpc IssueCertificate(ResourceRequest) returns (OperationResult);
  rpc RenewCertificate(ResourceRequest) returns (OperationResult);
  rpc ValidateCertificate(ResourceRequest) returns (OperationResult);
}
