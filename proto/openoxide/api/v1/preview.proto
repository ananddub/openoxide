syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

service PreviewDeploymentService {
  // List preview deployments; optional application_id scopes the result.
  rpc ListPreviews(ListPreviewsRequest) returns (ListPreviewsResponse);
  // Get one preview deployment by id.
  rpc GetPreview(GetPreviewRequest) returns (GetPreviewResponse);
  // Create a preview deployment. Required: application_id, branch; commit optional.
  rpc CreatePreview(CreatePreviewRequest) returns (CreatePreviewResponse);
  // Redeploy an existing preview by id.
  rpc RedeployPreview(RedeployPreviewRequest) returns (RedeployPreviewResponse);
  // Delete a preview deployment by id.
  rpc DeletePreview(DeletePreviewRequest) returns (Empty);
}

message PreviewDeployment {
  int64 id = 1;
  int64 application_id = 2;
  // Provider/deployment lifecycle string (e.g. "ERROR", "CLOSED"); open set.
  string status = 3;
  optional string branch = 4;
  optional string url = 5;
  optional string error = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message ListPreviewsRequest {
  optional int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ListPreviewsResponse {
  repeated PreviewDeployment previews = 1;
}

message GetPreviewRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetPreviewResponse {
  PreviewDeployment preview = 1;
}

message CreatePreviewRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  string branch = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  optional string commit = 3;
}

message CreatePreviewResponse {
  PreviewDeployment preview = 1;
}

message RedeployPreviewRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message RedeployPreviewResponse {
  PreviewDeployment preview = 1;
}

message DeletePreviewRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}
