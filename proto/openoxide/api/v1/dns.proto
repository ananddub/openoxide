syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

service DnsService {
  // List all saved DNS providers for the organization.
  rpc ListProviders(ListDnsProvidersRequest) returns (ListDnsProvidersResponse);
  // Get one DNS provider by id.
  rpc GetProvider(GetDnsProviderRequest) returns (GetDnsProviderResponse);
  // Create a DNS provider. Required: name, provider_type (DNS_PROVIDER_TYPE_*), credentials_json.
  rpc CreateProvider(CreateDnsProviderRequest) returns (CreateDnsProviderResponse);
  // Update a DNS provider by id; absent fields keep stored values (name, provider_type, credentials_json optional).
  rpc UpdateProvider(UpdateDnsProviderRequest) returns (UpdateDnsProviderResponse);
  // Delete a DNS provider by id.
  rpc DeleteProvider(DeleteDnsProviderRequest) returns (Empty);
  // Test a saved DNS provider's stored credentials by id.
  rpc TestProvider(TestDnsProviderRequest) returns (TestDnsProviderResponse);
  // Test unsaved DNS credentials before creating a provider. Required: provider_type, credentials_json.
  rpc TestConnection(TestDnsConnectionRequest) returns (TestDnsConnectionResponse);
  // List DNS zones available to a provider. Required: provider_id.
  rpc ListZones(ListDnsZonesRequest) returns (ListDnsZonesResponse);
  // List DNS records in a zone. Required: provider_id, zone_id.
  rpc ListRecords(ListDnsRecordsRequest) returns (ListDnsRecordsResponse);
  // Create a DNS record. Required: provider_id, zone_id, record_type (A/AAAA/CNAME/...), name, content; ttl/proxied optional.
  rpc CreateRecord(CreateDnsRecordRequest) returns (CreateDnsRecordResponse);
  // Edit a DNS record in place. Required: provider_id, zone_id, old_name + new record_type/name/content; id/old_* identify the row.
  rpc UpdateRecord(UpdateDnsRecordRequest) returns (UpdateDnsRecordResponse);
  // Delete a DNS record. Required: provider_id, zone_id, name; id/record_type/content narrow the match.
  rpc DeleteRecord(DeleteDnsRecordRequest) returns (Empty);
}

enum DnsProviderType {
  // The supported set is dns::DnsProviderKind; the numbers of the removed providers are
  // reserved rather than reused, so a stale client sending one is rejected instead of
  // silently mapped onto a different provider.
  reserved 3 to 5, 9 to 15, 17 to 37, 39 to 69;
  DNS_PROVIDER_TYPE_UNSPECIFIED = 0;
  DNS_PROVIDER_TYPE_CLOUDFLARE = 1;
  DNS_PROVIDER_TYPE_ROUTE53 = 2;
  DNS_PROVIDER_TYPE_PORKBUN = 6;
  DNS_PROVIDER_TYPE_INFOMANIAK = 7;
  DNS_PROVIDER_TYPE_OVH = 8;
  DNS_PROVIDER_TYPE_SPACESHIP = 16;
  DNS_PROVIDER_TYPE_HOSTINGER = 38;
}

message DnsProvider {
  int64 id = 1;
  string name = 2;
  DnsProviderType provider_type = 3;
  // Provider credentials document; shape is provider-specific.
  string credentials_json = 4;
  int64 organization_id = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

message DnsZone {
  // Zone identifier as issued by the provider (not a panel row id).
  string id = 1;
  string name = 2;
  optional string status = 3;
}

message DnsRecord {
  string id = 1;
  string zone_id = 2;
  // Provider-native record type ("A", "AAAA", "CNAME", "TXT", "MX", ...).
  string record_type = 3;
  string name = 4;
  string content = 5;
  optional uint32 ttl = 6;
  optional bool proxied = 7;
}

message ListDnsProvidersRequest {}

message ListDnsProvidersResponse {
  repeated DnsProvider providers = 1;
}

message GetDnsProviderRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetDnsProviderResponse {
  DnsProvider provider = 1;
}

message CreateDnsProviderRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 255];
  DnsProviderType provider_type = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string credentials_json = 3 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 1048576];
}

message CreateDnsProviderResponse {
  DnsProvider provider = 1;
}

message UpdateDnsProviderRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string name = 2 [(buf.validate.field).string.max_len = 255];
  optional DnsProviderType provider_type = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional string credentials_json = 4 [(buf.validate.field).string.max_len = 1048576];
}

message UpdateDnsProviderResponse {
  DnsProvider provider = 1;
}

message DeleteDnsProviderRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message TestDnsProviderRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message TestDnsProviderResponse {
  bool success = 1;
  string message = 2;
}

// Unsaved-credentials test used by the create dialog before a provider row exists.
message TestDnsConnectionRequest {
  DnsProviderType provider_type = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string credentials_json = 2 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 1048576];
}

message TestDnsConnectionResponse {
  bool success = 1;
  string message = 2;
}

message ListDnsZonesRequest {
  int64 provider_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ListDnsZonesResponse {
  repeated DnsZone zones = 1;
}

message ListDnsRecordsRequest {
  int64 provider_id = 1 [(buf.validate.field).int64.gt = 0];
  string zone_id = 2 [(buf.validate.field).string.min_len = 1];
}

message ListDnsRecordsResponse {
  repeated DnsRecord records = 1;
}

message CreateDnsRecordRequest {
  int64 provider_id = 1 [(buf.validate.field).int64.gt = 0];
  string zone_id = 2 [(buf.validate.field).string.min_len = 1];
  string record_type = 3 [(buf.validate.field).string.min_len = 1];
  string name = 4 [(buf.validate.field).string.min_len = 1];
  string content = 5 [(buf.validate.field).string.min_len = 1];
  optional uint32 ttl = 6;
  optional bool proxied = 7;
}

message CreateDnsRecordResponse {
  DnsRecord record = 1;
}

message DeleteDnsRecordRequest {
  int64 provider_id = 1 [(buf.validate.field).int64.gt = 0];
  string zone_id = 2 [(buf.validate.field).string.min_len = 1];
  // Record name relative to the zone ("www", "@" for apex). Providers whose API
  // has no record id identify a row by name + type + value, so it always goes back.
  string name = 3 [(buf.validate.field).string.min_len = 1];
  // The id ListRecords returned. Preferred when the provider has one.
  optional string id = 4;
  // Narrow the match to the clicked row: a name can hold several types, and a
  // type can hold several values.
  optional string record_type = 5;
  optional string content = 6;
}

// Edit one row in place. The old_* fields identify the row as ListRecords
// returned it; without them a rename would leave the original record behind.
message UpdateDnsRecordRequest {
  int64 provider_id = 1 [(buf.validate.field).int64.gt = 0];
  string zone_id = 2 [(buf.validate.field).string.min_len = 1];
  optional string id = 3;
  string old_name = 4 [(buf.validate.field).string.min_len = 1];
  optional string old_record_type = 5;
  optional string old_content = 6;
  string record_type = 7 [(buf.validate.field).string.min_len = 1];
  string name = 8 [(buf.validate.field).string.min_len = 1];
  string content = 9 [(buf.validate.field).string.min_len = 1];
  optional uint32 ttl = 10;
  optional bool proxied = 11;
}

message UpdateDnsRecordResponse {
  DnsRecord record = 1;
}
