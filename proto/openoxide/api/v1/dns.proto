syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

service DnsService {
  rpc ListProviders(ListDnsProvidersRequest) returns (ListDnsProvidersResponse);
  rpc GetProvider(GetDnsProviderRequest) returns (GetDnsProviderResponse);
  rpc CreateProvider(CreateDnsProviderRequest) returns (CreateDnsProviderResponse);
  rpc UpdateProvider(UpdateDnsProviderRequest) returns (UpdateDnsProviderResponse);
  rpc DeleteProvider(DeleteDnsProviderRequest) returns (Empty);
  rpc TestProvider(TestDnsProviderRequest) returns (TestDnsProviderResponse);
  rpc TestConnection(TestDnsConnectionRequest) returns (TestDnsConnectionResponse);
  rpc ListZones(ListDnsZonesRequest) returns (ListDnsZonesResponse);
  rpc ListRecords(ListDnsRecordsRequest) returns (ListDnsRecordsResponse);
  rpc CreateRecord(CreateDnsRecordRequest) returns (CreateDnsRecordResponse);
  rpc UpdateRecord(UpdateDnsRecordRequest) returns (UpdateDnsRecordResponse);
  rpc DeleteRecord(DeleteDnsRecordRequest) returns (Empty);
}

enum DnsProviderType {
  DNS_PROVIDER_TYPE_UNSPECIFIED = 0;
  DNS_PROVIDER_TYPE_CLOUDFLARE = 1;
  DNS_PROVIDER_TYPE_ROUTE53 = 2;
  DNS_PROVIDER_TYPE_HETZNER = 3;
  DNS_PROVIDER_TYPE_DIGITALOCEAN = 4;
  DNS_PROVIDER_TYPE_GODADDY = 5;
  DNS_PROVIDER_TYPE_PORKBUN = 6;
  DNS_PROVIDER_TYPE_INFOMANIAK = 7;
  DNS_PROVIDER_TYPE_OVH = 8;
  DNS_PROVIDER_TYPE_DESEC = 9;
  DNS_PROVIDER_TYPE_BUNNY = 10;
  DNS_PROVIDER_TYPE_CONSTELLIX = 11;
  DNS_PROVIDER_TYPE_DNSMADEEASY = 12;
  DNS_PROVIDER_TYPE_EXOSCALE = 13;
  DNS_PROVIDER_TYPE_NIFCLOUD = 14;
  DNS_PROVIDER_TYPE_WEBSUPPORT = 15;
  DNS_PROVIDER_TYPE_SPACESHIP = 16;
  DNS_PROVIDER_TYPE_DNSIMPLE = 17;
  DNS_PROVIDER_TYPE_GANDIV5 = 18;
  DNS_PROVIDER_TYPE_NAMEDOTCOM = 19;
  DNS_PROVIDER_TYPE_NAMESILO = 20;
  DNS_PROVIDER_TYPE_DUCKDNS = 21;
  DNS_PROVIDER_TYPE_FREEMYIP = 22;
  DNS_PROVIDER_TYPE_IPV64 = 23;
  DNS_PROVIDER_TYPE_DDNSS = 24;
  DNS_PROVIDER_TYPE_DYNU = 25;
  DNS_PROVIDER_TYPE_PLESK = 26;
  DNS_PROVIDER_TYPE_CPANEL = 27;
  DNS_PROVIDER_TYPE_GOOGLECLOUDDNS = 28;
  DNS_PROVIDER_TYPE_IONOS = 29;
  DNS_PROVIDER_TYPE_HOSTINGDE = 30;
  DNS_PROVIDER_TYPE_NETCUP = 31;
  DNS_PROVIDER_TYPE_NETLIFY = 32;
  DNS_PROVIDER_TYPE_HUAWEICLOUD = 33;
  DNS_PROVIDER_TYPE_BAIDUCLOUD = 34;
  DNS_PROVIDER_TYPE_AZUREDNS = 35;
  DNS_PROVIDER_TYPE_IBMCLOUD = 36;
  DNS_PROVIDER_TYPE_HURRICANE = 37;
  DNS_PROVIDER_TYPE_HOSTINGER = 38;
  DNS_PROVIDER_TYPE_AUTODNS = 39;
  DNS_PROVIDER_TYPE_LIGHTSAIL = 40;
  DNS_PROVIDER_TYPE_EDGEDNS = 41;
  DNS_PROVIDER_TYPE_SCALEWAY = 42;
  DNS_PROVIDER_TYPE_GCORE = 43;
  DNS_PROVIDER_TYPE_VERCEL = 44;
  DNS_PROVIDER_TYPE_VULTR = 45;
  DNS_PROVIDER_TYPE_BLUECATV2 = 46;
  DNS_PROVIDER_TYPE_EASYDNS = 47;
  DNS_PROVIDER_TYPE_JOKER = 48;
  DNS_PROVIDER_TYPE_MYTHICBEASTS = 49;
  DNS_PROVIDER_TYPE_NAMECHEAP = 50;
  DNS_PROVIDER_TYPE_TRANSIP = 51;
  DNS_PROVIDER_TYPE_NS1 = 52;
  DNS_PROVIDER_TYPE_LUADNS = 53;
  DNS_PROVIDER_TYPE_CLOUDNS = 54;
  DNS_PROVIDER_TYPE_GLESYS = 55;
  DNS_PROVIDER_TYPE_DREAMHOST = 56;
  DNS_PROVIDER_TYPE_ALIDNS = 57;
  DNS_PROVIDER_TYPE_TENCENTCLOUD = 58;
