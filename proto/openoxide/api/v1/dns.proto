  DNS_PROVIDER_TYPE_SAFEDNS = 62;
  DNS_PROVIDER_TYPE_SIMPLYCOM = 63;
  DNS_PROVIDER_TYPE_ARVANCLOUD = 64;
  DNS_PROVIDER_TYPE_INWX = 65;
