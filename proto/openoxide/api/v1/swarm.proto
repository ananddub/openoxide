syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";

service SwarmService {
  rpc GetSettings(ResourceRequest) returns (ResourceResponse);
  rpc UpdateSettings(ResourceRequest) returns (ResourceResponse);
  rpc ListNetworks(ResourceQuery) returns (ResourceListResponse);
  rpc CreateNetwork(ResourceRequest) returns (ResourceResponse);
  rpc UpdateNetwork(ResourceRequest) returns (ResourceResponse);
  rpc DeleteNetwork(ResourceRequest) returns (Empty);
  rpc ListServices(ResourceQuery) returns (ResourceListResponse);
  rpc GetService(ResourceRequest) returns (ResourceResponse);
  rpc UpdateService(ResourceRequest) returns (ResourceResponse);
}
