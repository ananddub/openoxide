syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";

service BackupService {
  rpc ListBackups(ResourceQuery) returns (ResourceListResponse);
  rpc GetBackup(ResourceRequest) returns (ResourceResponse);
  rpc CreateBackup(ResourceRequest) returns (ResourceResponse);
  rpc UpdateBackup(ResourceRequest) returns (ResourceResponse);
  rpc DeleteBackup(ResourceRequest) returns (Empty);
  rpc RunBackup(ResourceRequest) returns (OperationResult);
  rpc RestoreBackup(ResourceRequest) returns (OperationResult);
  rpc ValidateDestination(ResourceRequest) returns (OperationResult);
}
