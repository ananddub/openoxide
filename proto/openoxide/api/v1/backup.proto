syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

// Sole backup owner service; absorbs the former BackupOperationsService.
service BackupService {
  // List all configured database backup rules. No params.
  rpc ListBackups(BackupListBackupsRequest) returns (BackupListBackupsResponse);
  // Get one database backup rule by id.
  rpc GetBackup(BackupGetBackupRequest) returns (BackupGetBackupResponse);
  // Create a database backup rule. Required: app_name, schedule (cron), database_name, prefix, backup_type, database_type, destination_id, organization_id.
  rpc CreateBackup(BackupCreateBackupRequest) returns (BackupCreateBackupResponse);
  // Update a database backup rule by id; absent fields keep stored values. `enabled` toggles the schedule.
  rpc UpdateBackup(BackupUpdateBackupRequest) returns (BackupUpdateBackupResponse);
  // Delete a database backup rule by id.
  rpc DeleteBackup(BackupDeleteBackupRequest) returns (Empty);
  // Trigger a database backup rule to run now by id.
  rpc RunBackup(BackupRunBackupRequest) returns (Empty);
  // Restore a database backup rule by id from a chosen backup_file.
  rpc RestoreBackup(BackupRestoreBackupRequest) returns (Empty);
  // Validate connectivity/credentials of a backup destination by destination_id.
  rpc ValidateDestination(BackupValidateDestinationRequest) returns (BackupValidateDestinationResponse);
  // Run a compose config backup now for compose_id; include_secrets optionally bundles secrets. Returns a local archive.
  rpc RunComposeBackup(BackupRunComposeBackupRequest) returns (BackupRunComposeBackupResponse);
  // Run a panel backup now (no params). Returns the produced local archive.
  rpc RunPanelBackup(BackupRunPanelBackupRequest) returns (BackupRunPanelBackupResponse);
  // Stage a panel restore from a .tar.gz archive path (optional checksum_sha256); applies on next restart.
  rpc StageRestore(BackupStageRestoreRequest) returns (BackupStageRestoreResponse);
  // Get progress of a staged panel restore by restore_id.
  rpc GetRestoreStatus(BackupGetRestoreStatusRequest) returns (BackupGetRestoreStatusResponse);
  // Stage a rollback of a panel restore using a .pre-restore- recovery_database snapshot path.
  rpc RollbackRestore(BackupRollbackRestoreRequest) returns (BackupRollbackRestoreResponse);
  // List remote backup objects for destination_id; optional prefix filters by object-key prefix.
  rpc ListFiles(BackupListFilesRequest) returns (BackupListFilesResponse);
  // Download a backup object by destination_id and object_key; reply reports file metadata.
  rpc DownloadFile(BackupDownloadFileRequest) returns (BackupDownloadFileResponse);
  // Preview which objects a keep-latest rule would keep/delete. Required: destination_id, keep_latest; optional prefix.
  rpc PreviewRetention(BackupPreviewRetentionRequest) returns (BackupPreviewRetentionResponse);
  // Verify a backup object's checksum. Required: destination_id, object_key, checksum_sha256.
  rpc VerifyFiles(BackupVerifyFilesRequest) returns (BackupVerifyFilesResponse);
  // List recorded backup/restore executions; optional limit (clamped 1..=500, default 100).
  rpc ListExecutions(BackupListExecutionsRequest) returns (BackupListExecutionsResponse);
  // Retry a failed backup execution by id.
  rpc RetryExecution(BackupRetryExecutionRequest) returns (Empty);
  // List all database backup rules (no params).
  rpc ListDatabaseBackups(BackupListDatabaseBackupsRequest) returns (BackupListDatabaseBackupsResponse);
  // Get one database backup rule by id.
  rpc GetDatabaseBackup(BackupGetDatabaseBackupRequest) returns (BackupGetDatabaseBackupResponse);
  // Create a database backup rule. Required: app_name, schedule (cron), database_name, prefix, backup_type, database_type, destination_id, organization_id.
  rpc CreateDatabaseBackup(BackupCreateDatabaseBackupRequest) returns (BackupCreateDatabaseBackupResponse);
  // Update a database backup rule by id; absent fields keep stored values. `enabled` toggles the schedule.
  rpc UpdateDatabaseBackup(BackupUpdateDatabaseBackupRequest) returns (BackupUpdateDatabaseBackupResponse);
  // Delete a database backup rule by id.
  rpc DeleteDatabaseBackup(BackupDeleteDatabaseBackupRequest) returns (Empty);
  // Trigger a database backup rule to run now by id.
  rpc RunDatabaseBackup(BackupRunDatabaseBackupRequest) returns (Empty);
  // List all volume backup rules (no params).
  rpc ListVolumeBackups(BackupListVolumeBackupsRequest) returns (BackupListVolumeBackupsResponse);
  // Get one volume backup rule by id.
  rpc GetVolumeBackup(BackupGetVolumeBackupRequest) returns (BackupGetVolumeBackupResponse);
  // Create a volume backup rule. Required: name, volume_name, prefix, service_type, app_name, cron_expression; one service linkage id must resolve.
  rpc CreateVolumeBackup(BackupCreateVolumeBackupRequest) returns (BackupCreateVolumeBackupResponse);
  // Update a volume backup rule by id; absent fields keep stored values. `enabled` toggles the schedule.
  rpc UpdateVolumeBackup(BackupUpdateVolumeBackupRequest) returns (BackupUpdateVolumeBackupResponse);
  // Delete a volume backup rule by id.
  rpc DeleteVolumeBackup(BackupDeleteVolumeBackupRequest) returns (Empty);
  // Trigger a volume backup rule to run now by id.
  rpc RunVolumeBackup(BackupRunVolumeBackupRequest) returns (Empty);
  // Restore a database from a backup. Required: id (database backup rule), backup_file.
  rpc RestoreDatabase(BackupRestoreDatabaseRequest) returns (Empty);
  // Restore a volume from a backup. Required: id (volume backup rule), backup_file.
  rpc RestoreVolume(BackupRestoreVolumeRequest) returns (Empty);
}

enum BackupKind {
  BACKUP_KIND_UNSPECIFIED = 0;
  BACKUP_KIND_DATABASE = 1;
  BACKUP_KIND_VOLUME = 2;
  BACKUP_KIND_PANEL = 3;
  BACKUP_KIND_COMPOSE_CONFIG = 4;
}

enum BackupOperation {
  BACKUP_OPERATION_UNSPECIFIED = 0;
  BACKUP_OPERATION_BACKUP = 1;
  BACKUP_OPERATION_RESTORE = 2;
}

enum BackupExecutionStatus {
  BACKUP_EXECUTION_STATUS_UNSPECIFIED = 0;
  BACKUP_EXECUTION_STATUS_RUNNING = 1;
  BACKUP_EXECUTION_STATUS_SUCCEEDED = 2;
  BACKUP_EXECUTION_STATUS_FAILED = 3;
}

// kind "database_backup": a scheduled database backup rule.
message BackupDatabase {
  int64 id = 1;
  string app_name = 2;
  // Cron expression driving the schedule.
  string schedule = 3;
  bool enabled = 4;
  string database_name = 5;
  string prefix = 6;
  optional string service_name = 7;
  optional int64 keep_latest_count = 8;
  // Free-form backup engine selector (e.g. "pg_dump").
  string backup_type = 9;
  // Free-form database flavor stored as a string; canonical inputs are POSTGRES/POSTGRESQL/MYSQL/MARIADB/MONGO/MONGODB/REDIS/LIBSQL.
  optional string database_type = 10;
  // Optional JSON document with extra backup configuration.
  optional string metadata = 11;
  optional int64 service_id = 12;
  int64 destination_id = 13;
  int64 organization_id = 14;
  int64 created_at = 15;
  int64 updated_at = 16;
}

// kind "volume_backup": a scheduled volume backup rule.
message BackupVolume {
  int64 id = 1;
  string name = 2;
  string volume_name = 3;
  string prefix = 4;
  // Free-form service flavor stored as a string (APPLICATION, COMPOSE, POSTGRES, MYSQL, MARIADB, MONGO, REDIS, LIBSQL, "standalone", ...).
  string service_type = 5;
  string app_name = 6;
  optional string service_name = 7;
  // Stops the owning service for the duration of the backup.
  bool turn_off = 8;
  string cron_expression = 9;
  optional int64 keep_latest_count = 10;
  bool enabled = 11;
  int64 destination_id = 12;
  int64 organization_id = 13;
  optional int64 service_id = 14;
  // Typed linkage mirrors derived from (service_type, service_id).
  optional int64 application_id = 15;
  optional int64 compose_id = 16;
  optional int64 postgres_id = 17;
  optional int64 mysql_id = 18;
  optional int64 mariadb_id = 19;
  optional int64 mongo_id = 20;
  optional int64 redis_id = 21;
  optional int64 libsql_id = 22;
  int64 created_at = 23;
  int64 updated_at = 24;
}

// kind "backup_execution": one recorded backup/restore run.
message BackupExecution {
  int64 id = 1;
  BackupKind backup_kind = 2;
  BackupOperation operation = 3;
  optional int64 backup_id = 4;
  BackupExecutionStatus status = 5;
  optional string object_key = 6;
  optional string checksum_sha256 = 7;
  optional int64 size_bytes = 8;
  int64 attempt = 9;
  optional string error = 10;
  int64 started_at = 11;
  optional int64 finished_at = 12;
}

// kind "backup_file": one remote object listed through rclone.
message BackupFile {
  string name = 1;
  string path = 2;
  int64 size_bytes = 3;
  // Provider-formatted modification timestamp string.
  string modified_at = 4;
}

// Local archive produced by a panel or compose-config backup.
message BackupArchive {
  string path = 1;
  string checksum_sha256 = 2;
  int64 size_bytes = 3;
  int64 created_at = 4;
}

// Staged restore (or rollback) awaiting a panel restart.
message BackupStagedRestore {
  string restore_id = 1;
  string checksum_sha256 = 2;
  bool restart_required = 3;
  string pending_marker = 4;
}

// kind "panel_restore_status": progress of a staged panel restore.
message BackupRestoreStatus {
  string restore_id = 1;
  // "PENDING_RESTART" while staged; terminal values come from the restore history file, so the string stays free-form.
  string status = 2;
  string message = 3;
  int64 updated_at = 4;
}

// kind "retention_preview": which files a keep-latest rule would keep/delete.
message BackupRetentionPreview {
  repeated BackupFile keep = 1;
  repeated BackupFile delete = 2;
}

// kind "backup_integrity": checksum verification outcome for one object.
message BackupIntegrity {
  bool valid = 1;
  string expected_sha256 = 2;
  string actual_sha256 = 3;
  int64 size_bytes = 4;
}

message BackupListBackupsRequest {}

message BackupListBackupsResponse {
  repeated BackupDatabase backups = 1;
}

message BackupGetBackupRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message BackupGetBackupResponse {
  BackupDatabase backup = 1;
}

message BackupCreateBackupRequest {
  string app_name = 1 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 255];
  string schedule = 2 [(buf.validate.field).string.min_len = 1];
  string database_name = 3 [(buf.validate.field).string.min_len = 1];
  string prefix = 4 [(buf.validate.field).string.min_len = 1];
  optional string service_name = 5 [(buf.validate.field).string.max_len = 255];
  optional int64 keep_latest_count = 6 [(buf.validate.field).int64.gte = 0];
  string backup_type = 7 [(buf.validate.field).string.min_len = 1];
  string database_type = 8 [(buf.validate.field).string.min_len = 1];
  // Optional JSON document with extra backup configuration.
  optional string metadata = 9 [(buf.validate.field).string.max_len = 1048576];
  optional int64 service_id = 10 [(buf.validate.field).int64.gt = 0];
  int64 destination_id = 11 [(buf.validate.field).int64.gt = 0];
  int64 organization_id = 12 [(buf.validate.field).int64.gt = 0];
}

message BackupCreateBackupResponse {
  BackupDatabase backup = 1;
}

// An absent field keeps its stored value; `enabled` replaces the i64 flag.
message BackupUpdateBackupRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string app_name = 2 [(buf.validate.field).string.max_len = 255];
  optional string schedule = 3;
  optional string database_name = 4;
  optional string prefix = 5;
  optional string service_name = 6 [(buf.validate.field).string.max_len = 255];
  optional int64 keep_latest_count = 7 [(buf.validate.field).int64.gte = 0];
  optional string backup_type = 8;
  optional string database_type = 9;
  optional string metadata = 10 [(buf.validate.field).string.max_len = 1048576];
  optional int64 destination_id = 11 [(buf.validate.field).int64.gt = 0];
  optional bool enabled = 12;
}

message BackupUpdateBackupResponse {
  BackupDatabase backup = 1;
}

message BackupDeleteBackupRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message BackupRunBackupRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message BackupRestoreBackupRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string backup_file = 2 [(buf.validate.field).string.min_len = 1];
}

message BackupValidateDestinationRequest {
  int64 destination_id = 1 [(buf.validate.field).int64.gt = 0];
}

message BackupValidateDestinationResponse {
  bool success = 1;
  string message = 2;
}

message BackupRunComposeBackupRequest {
  // Compose id the config bundle is exported for (former envelope `id`).
  int64 compose_id = 1 [(buf.validate.field).int64.gt = 0];
  bool include_secrets = 2;
}

message BackupRunComposeBackupResponse {
  BackupArchive archive = 1;
}

message BackupRunPanelBackupRequest {}

message BackupRunPanelBackupResponse {
  BackupArchive archive = 1;
}

message BackupStageRestoreRequest {
  // Absolute path to a .tar.gz panel archive inside the backup directory.
  string archive = 1 [(buf.validate.field).string.min_len = 1];
  optional string checksum_sha256 = 2;
}

message BackupStageRestoreResponse {
  BackupStagedRestore staged = 1;
}

message BackupGetRestoreStatusRequest {
  // Restore handle returned by StageRestore/RollbackRestore.
  string restore_id = 1 [(buf.validate.field).string.min_len = 1];
}

message BackupGetRestoreStatusResponse {
  BackupRestoreStatus status = 1;
}

message BackupRollbackRestoreRequest {
  // Absolute path to a `.pre-restore-` database snapshot.
  string recovery_database = 1 [(buf.validate.field).string.min_len = 1];
}

message BackupRollbackRestoreResponse {
  BackupStagedRestore staged = 1;
}

message BackupListFilesRequest {
  // S3 destination the objects are listed through (former envelope `organization_id` slot).
  int64 destination_id = 1 [(buf.validate.field).int64.gt = 0];
  // Object key prefix filter; empty lists the whole destination.
  optional string prefix = 2 [(buf.validate.field).string.max_len = 1024];
}

message BackupListFilesResponse {
  repeated BackupFile files = 1;
}

message BackupDownloadFileRequest {
  int64 destination_id = 1 [(buf.validate.field).int64.gt = 0];
  string object_key = 2 [(buf.validate.field).string.min_len = 1];
}

// The file is streamed back to the node; the reply only reports its metadata.
message BackupDownloadFileResponse {
  int64 size_bytes = 1;
  string object_key = 2;
}

message BackupPreviewRetentionRequest {
  int64 destination_id = 1 [(buf.validate.field).int64.gt = 0];
  optional string prefix = 2 [(buf.validate.field).string.max_len = 1024];
  int64 keep_latest = 3 [(buf.validate.field).int64.gte = 1];
}

message BackupPreviewRetentionResponse {
  BackupRetentionPreview preview = 1;
}

message BackupVerifyFilesRequest {
  int64 destination_id = 1 [(buf.validate.field).int64.gt = 0];
  string object_key = 2 [(buf.validate.field).string.min_len = 1];
  string checksum_sha256 = 3 [(buf.validate.field).string.min_len = 1];
}

message BackupVerifyFilesResponse {
  BackupIntegrity integrity = 1;
}

message BackupListExecutionsRequest {
  // Cap on returned rows; the server clamps it to 1..=500 (default 100).
  optional int64 limit = 1 [(buf.validate.field).int64 = {gte: 1, lte: 500}];
}

message BackupListExecutionsResponse {
  repeated BackupExecution executions = 1;
}

message BackupRetryExecutionRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message BackupListDatabaseBackupsRequest {}

message BackupListDatabaseBackupsResponse {
  repeated BackupDatabase backups = 1;
}

message BackupGetDatabaseBackupRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message BackupGetDatabaseBackupResponse {
  BackupDatabase backup = 1;
}

message BackupCreateDatabaseBackupRequest {
  string app_name = 1 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 255];
  string schedule = 2 [(buf.validate.field).string.min_len = 1];
  string database_name = 3 [(buf.validate.field).string.min_len = 1];
  string prefix = 4 [(buf.validate.field).string.min_len = 1];
  optional string service_name = 5 [(buf.validate.field).string.max_len = 255];
  optional int64 keep_latest_count = 6 [(buf.validate.field).int64.gte = 0];
  string backup_type = 7 [(buf.validate.field).string.min_len = 1];
  string database_type = 8 [(buf.validate.field).string.min_len = 1];
  // Optional JSON document with extra backup configuration.
  optional string metadata = 9 [(buf.validate.field).string.max_len = 1048576];
  optional int64 service_id = 10 [(buf.validate.field).int64.gt = 0];
  int64 destination_id = 11 [(buf.validate.field).int64.gt = 0];
  int64 organization_id = 12 [(buf.validate.field).int64.gt = 0];
}

message BackupCreateDatabaseBackupResponse {
  BackupDatabase backup = 1;
}

// An absent field keeps its stored value.
message BackupUpdateDatabaseBackupRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string app_name = 2 [(buf.validate.field).string.max_len = 255];
  optional string schedule = 3;
  optional string database_name = 4;
  optional string prefix = 5;
  optional string service_name = 6 [(buf.validate.field).string.max_len = 255];
  optional int64 keep_latest_count = 7 [(buf.validate.field).int64.gte = 0];
  optional string backup_type = 8;
  optional string database_type = 9;
  optional string metadata = 10 [(buf.validate.field).string.max_len = 1048576];
  optional int64 destination_id = 11 [(buf.validate.field).int64.gt = 0];
  optional bool enabled = 12;
}

message BackupUpdateDatabaseBackupResponse {
  BackupDatabase backup = 1;
}

message BackupDeleteDatabaseBackupRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message BackupRunDatabaseBackupRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message BackupListVolumeBackupsRequest {}

message BackupListVolumeBackupsResponse {
  repeated BackupVolume backups = 1;
}

message BackupGetVolumeBackupRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message BackupGetVolumeBackupResponse {
  BackupVolume backup = 1;
}

// At least one of `service_id` and the typed linkage ids must resolve to a service; the server folds them into a single services row.
message BackupCreateVolumeBackupRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 255];
  string volume_name = 2 [(buf.validate.field).string.min_len = 1];
  string prefix = 3 [(buf.validate.field).string.min_len = 1];
  string service_type = 4 [(buf.validate.field).string.min_len = 1];
  string app_name = 5 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 255];
  optional string service_name = 6 [(buf.validate.field).string.max_len = 255];
  bool turn_off = 7;
  string cron_expression = 8 [(buf.validate.field).string.min_len = 1];
  optional int64 keep_latest_count = 9 [(buf.validate.field).int64.gte = 0];
  optional int64 destination_id = 10 [(buf.validate.field).int64.gt = 0];
  optional int64 organization_id = 11 [(buf.validate.field).int64.gt = 0];
  optional int64 service_id = 12 [(buf.validate.field).int64.gt = 0];
  optional int64 application_id = 13 [(buf.validate.field).int64.gt = 0];
  optional int64 compose_id = 14 [(buf.validate.field).int64.gt = 0];
  optional int64 database_id = 15 [(buf.validate.field).int64.gt = 0];
  optional int64 postgres_id = 16 [(buf.validate.field).int64.gt = 0];
  optional int64 mysql_id = 17 [(buf.validate.field).int64.gt = 0];
  optional int64 mariadb_id = 18 [(buf.validate.field).int64.gt = 0];
  optional int64 mongo_id = 19 [(buf.validate.field).int64.gt = 0];
  optional int64 redis_id = 20 [(buf.validate.field).int64.gt = 0];
  optional int64 libsql_id = 21 [(buf.validate.field).int64.gt = 0];
}

message BackupCreateVolumeBackupResponse {
  BackupVolume backup = 1;
}

// An absent field keeps its stored value.
message BackupUpdateVolumeBackupRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string name = 2 [(buf.validate.field).string.max_len = 255];
  optional string volume_name = 3;
  optional string prefix = 4;
  optional string service_type = 5;
  optional string app_name = 6 [(buf.validate.field).string.max_len = 255];
  optional string service_name = 7 [(buf.validate.field).string.max_len = 255];
  optional bool turn_off = 8;
  optional string cron_expression = 9;
  optional int64 keep_latest_count = 10 [(buf.validate.field).int64.gte = 0];
  optional int64 destination_id = 11 [(buf.validate.field).int64.gt = 0];
  optional bool enabled = 12;
}

message BackupUpdateVolumeBackupResponse {
  BackupVolume backup = 1;
}

message BackupDeleteVolumeBackupRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message BackupRunVolumeBackupRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message BackupRestoreDatabaseRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string backup_file = 2 [(buf.validate.field).string.min_len = 1];
}

message BackupRestoreVolumeRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string backup_file = 2 [(buf.validate.field).string.min_len = 1];
}
