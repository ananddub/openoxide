syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
service MonitoringOperationsService {
  rpc GetLocalMetrics(Empty) returns (ResourceResponse);
  rpc GetServerMetrics(ResourceRequest) returns (ResourceResponse);
  rpc GetContainerMetrics(ResourceRequest) returns (ResourceResponse);
  rpc GetContainerStates(ResourceRequest) returns (ResourceListResponse);
  rpc CreateAgentToken(ResourceRequest) returns (ResourceResponse);
  rpc GetAgentStatus(ResourceRequest) returns (OperationResult);
  rpc StartAgent(ResourceRequest) returns (OperationResult);
  rpc StopAgent(ResourceRequest) returns (OperationResult);
  rpc RestartAgent(ResourceRequest) returns (OperationResult);
  rpc ReinstallAgent(ResourceRequest) returns (OperationResult);
  rpc ExportServerMetrics(ResourceRequest) returns (ResourceResponse);
  rpc GetPrometheusMetrics(ResourceRequest) returns (ResourceResponse);
  rpc CreateMaintenanceWindow(ResourceRequest) returns (ResourceResponse);
  rpc ListMaintenanceWindows(ResourceQuery) returns (ResourceListResponse);
  rpc DeleteMaintenanceWindow(ResourceRequest) returns (Empty);
}
