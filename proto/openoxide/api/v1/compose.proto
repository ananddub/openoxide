syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

service ComposeService {
  // Fetch a single compose project by id.
  rpc GetCompose(GetComposeRequest) returns (Compose);
  // List all compose projects in an environment. Required: environment_id.
  rpc ListComposes(ListComposesRequest) returns (ListComposesResponse);
  // Create a compose project. Required: name, environment_id; server_id, compose_file, compose_type ("DOCKER-COMPOSE"|"STACK") optional.
  rpc CreateCompose(CreateComposeRequest) returns (Compose);
  // Update compose fields by id: name, description, compose_file, server_id, network_ids, command, randomize, env_var.
  rpc UpdateCompose(UpdateComposeRequest) returns (Compose);
  // Delete a compose project by id.
  rpc DeleteCompose(DeleteComposeRequest) returns (Empty);
  // Set the compose source to a GitHub repo by id. Required: repository, owner; branch, build_path, provider_id optional.
  rpc SetGithubSource(SetComposeSourceRequest) returns (Compose);
  // Set the compose source to a GitLab repo by id. Required: repository, owner; branch, build_path, provider_id optional.
  rpc SetGitlabSource(SetComposeSourceRequest) returns (Compose);
  // Set the compose source to a Bitbucket repo by id. Required: repository, owner; branch, build_path, provider_id optional.
  rpc SetBitbucketSource(SetComposeSourceRequest) returns (Compose);
  // Set the compose source to a Gitea repo by id. Required: repository, owner; branch, build_path, provider_id optional.
  rpc SetGiteaSource(SetComposeSourceRequest) returns (Compose);
  // Set the compose source to a custom Git repo by id. Required: repository, owner; branch, build_path, ssh_key_id (private clone) optional.
  rpc SetCustomGitSource(SetComposeSourceRequest) returns (Compose);
  // Set the compose source to raw inline YAML by id. Required: content; file_name optional.
  rpc SetRawSource(SetRawSourceRequest) returns (Compose);
  // Stream-upload compose source: first compose_id then raw file chunks.
  rpc UploadSource(stream UploadComposeRequest) returns (Compose);
  // Build and deploy a compose service for the first time or after config changes. Takes the compose id.
  rpc Deploy(ComposeOperationRequest) returns (ComposeOperation);
  // Redeploy an existing compose service with its current config, picking up domain/env changes. Takes the compose id.
  rpc Redeploy(ComposeOperationRequest) returns (ComposeOperation);
  // Reload a compose service by id, applying config/env changes without a full redeploy.
  rpc Reload(ComposeOperationRequest) returns (ComposeOperation);
  // Start a stopped compose service. Takes the compose id.
  rpc Start(ComposeOperationRequest) returns (ComposeOperation);
  // Stop a running compose service (destructive: makes it unavailable until started again). Takes the compose id.
  rpc Stop(ComposeOperationRequest) returns (ComposeOperation);
  // Cancel the in-progress operation/deployment for a compose project by id.
  rpc Cancel(ComposeOperationRequest) returns (Empty);
  // Move a compose project to another environment. Required: id, target_environment_id.
  rpc MoveCompose(MoveComposeRequest) returns (Compose);
  // @internal Rotate the deploy-webhook token for a compose project by id; returns the new token.
  rpc RotateWebhookToken(ComposeOperationRequest) returns (ComposeWebhookToken);
  // List resources this compose project depends on, by id.
  rpc ListDependencies(ComposeOperationRequest) returns (ComposeDependencies);
  // Preview parsed compose YAML and its services without saving. Required: content.
  rpc PreviewCompose(PreviewComposeRequest) returns (ComposePreview);
  // Install a compose from a template. Required: template, environment_id; name, server_id, env_var optional.
  rpc InstallTemplate(InstallTemplateRequest) returns (Compose);
  // Export a compose project by id as an archive. Required: id; include_secrets toggles secret inclusion.
  rpc ExportCompose(ExportComposeRequest) returns (ComposeExport);
  // Import a compose project into an environment. Required: environment_id, archive.
  rpc ImportCompose(ImportComposeRequest) returns (Compose);
  // Remove specific services from a compose project. Required: id, services (1-100 names).
  rpc RemoveServices(ServiceMutationRequest) returns (Empty);
  // Update compose resource limits by id: memory_limit, cpu_limit, replicas.
  rpc UpdateResources(UpdateComposeResourcesRequest) returns (Compose);
  // Clear the deployment history records for a compose project by id.
  rpc ClearDeploymentHistory(ComposeOperationRequest) returns (Empty);
  // Remove queued (pending) deployments for a compose project by id.
  rpc CleanupDeploymentQueue(ComposeOperationRequest) returns (Empty);
  // Force-kill a stuck deployment for a compose project by id.
  rpc ForceKillDeployment(ComposeOperationRequest) returns (Empty);
  // List mount rows for a compose project. Required: compose_id.
  rpc ListMounts(ComposeListMountsRequest) returns (ComposeListMountsResponse);
  // Create a mount. Required: compose_id, mount_type (ComposeMountType), mount_path; host_path/volume_name/file_path/content per type.
  rpc CreateMount(ComposeCreateMountRequest) returns (ComposeCreateMountResponse);
  // Update a mount. Required: compose_id, id, mount_type (ComposeMountType), mount_path; type-specific path/content fields.
  rpc UpdateMount(ComposeUpdateMountRequest) returns (ComposeUpdateMountResponse);
  // Delete a mount. Required: compose_id; id of the mount to remove.
  rpc DeleteMount(ComposeMountRequest) returns (Empty);
  // List file-patch rows for a compose project. Required: compose_id.
  rpc ListPatches(ComposeListPatchesRequest) returns (ComposeListPatchesResponse);
  // Create a file patch. Required: compose_id, patch_type (ComposePatchType), file_path, enabled; content holds the patch body.
  rpc CreatePatch(ComposeCreatePatchRequest) returns (ComposeCreatePatchResponse);
  // Update a file patch. Required: compose_id, id, patch_type (ComposePatchType), file_path, enabled, content.
  rpc UpdatePatch(ComposeUpdatePatchRequest) returns (ComposeUpdatePatchResponse);
  // Delete a file patch. Required: compose_id, patch_type, payload; id of the patch to remove.
  rpc DeletePatch(ComposePatchRequest) returns (Empty);
}
message Compose {
  int64 id = 1;
  string name = 2;
  optional string description = 3;
  int64 environment_id = 4;
  optional int64 server_id = 5;
  string status = 6;
  optional string source_type = 7;
  optional string repository = 8;
  optional string branch = 9;
  optional string compose_file = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
  // Source round-trip: the source-settings card re-seeds from these after save/refetch; without them every provider except GitHub looked unset.
  optional string owner = 13;
  optional string gitlab_repository = 14;
  optional string gitlab_owner = 15;
  optional string gitlab_branch = 16;
  optional string gitea_repository = 17;
  optional string gitea_owner = 18;
  optional string gitea_branch = 19;
  optional string bitbucket_repository = 20;
  optional string bitbucket_owner = 21;
  optional string bitbucket_branch = 22;
  optional string custom_git_url = 23;
  optional string custom_git_branch = 24;
  optional string command = 25;
  optional string compose_path = 26;
  optional string compose_type = 27;
  optional string last_error = 28;
  optional string build_path = 29;
  optional int64 custom_git_ssh_key_id = 30;
  // Name-randomization state: when true, deploy renames every service to `{name}-{suffix}`.
  bool randomize = 31;
  optional string suffix = 32;
  // Resolved environment (.env-style KEY=VALUE lines), including any secrets a
  // template generated at install time, so the GUI env editor can display and
  // edit them.
  optional string env_var = 33;
}
message GetComposeRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}
message ListComposesRequest {
  int64 environment_id = 1 [(buf.validate.field).int64.gt = 0];
}
message ListComposesResponse {
  repeated Compose composes = 1;
}
message CreateComposeRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  optional string description = 2;
  int64 environment_id = 3 [(buf.validate.field).int64.gt = 0];
  optional int64 server_id = 4;
  optional string compose_file = 5;
  // Canonical ComposeType spelling ("DOCKER-COMPOSE" | "STACK"); unset defaults to DOCKER-COMPOSE. Unknown values are rejected, not coerced.
  optional string compose_type = 6;
}
message UpdateComposeRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string name = 2;
  optional string description = 3;
  optional string compose_file = 4;
  optional int64 server_id = 5;
  repeated string network_ids = 6;
  optional string command = 7;
  // Toggle service-name randomization. false clears the stored suffix so services keep their literal names.
  optional bool randomize = 8;
  optional string env_var = 9;
}
message DeleteComposeRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}
message ComposeOperationRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}
message ComposeOperation {
  Compose compose = 1;
  string operation = 2;
}
message SetComposeSourceRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string repository = 2 [(buf.validate.field).string.min_len = 1];
  string owner = 3 [(buf.validate.field).string.min_len = 1];
  optional string branch = 4;
  optional string build_path = 5;
  optional int64 provider_id = 6;
  // CUSTOM provider only: SSH key used to clone a private custom-git repo.
  optional int64 ssh_key_id = 7;
}
message SetRawSourceRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string content = 2 [(buf.validate.field).string = {min_len: 1, max_len: 1048576}];
  optional string file_name = 3;
}
message UploadComposeRequest {
  oneof payload {
    int64 compose_id = 1 [(buf.validate.field).int64.gt = 0];
    bytes chunk = 2 [(buf.validate.field).bytes = {min_len: 1, max_len: 4194304}];
  }
}
message MoveComposeRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  int64 target_environment_id = 2 [(buf.validate.field).int64.gt = 0];
}
message ComposeWebhookToken {
  string token = 1;
}
message ComposeDependencies {
  repeated string items = 1;
}
message PreviewComposeRequest {
  string content = 1 [(buf.validate.field).string = {min_len: 1, max_len: 1048576}];
}
message ComposePreview {
  string content = 1;
  repeated string services = 2;
}
message InstallTemplateRequest {
  string template = 1 [(buf.validate.field).string.min_len = 1];
  int64 environment_id = 2 [(buf.validate.field).int64.gt = 0];
  optional string name = 3;
  optional int64 server_id = 4;
  // .env-style KEY=VALUE lines seeded on the new compose after install.
  optional string env_var = 5;
}
message ExportComposeRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  bool include_secrets = 2;
}
message ComposeExport {
  string archive = 1;
}
message ImportComposeRequest {
  int64 environment_id = 1 [(buf.validate.field).int64.gt = 0];
  string archive = 2 [(buf.validate.field).string = {min_len: 1, max_len: 10485760}];
}
message ServiceMutationRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  repeated string services = 2 [(buf.validate.field).repeated = {min_items: 1, max_items: 100}];
}
message UpdateComposeResourcesRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string memory_limit = 2;
  optional string cpu_limit = 3;
  optional int64 replicas = 4;
}
message ComposeMountRequest {
  int64 compose_id = 1 [(buf.validate.field).int64.gt = 0];
  optional int64 id = 2 [(buf.validate.field).int64.gt = 0];
  string mount_type = 3 [(buf.validate.field).string.min_len = 1];
  optional string host_path = 4;
  optional string volume_name = 5;
  optional string file_path = 6;
  optional string content = 7;
  string mount_path = 8 [(buf.validate.field).string.min_len = 1];
}
message ComposePatchRequest {
  int64 compose_id = 1 [(buf.validate.field).int64.gt = 0];
  optional int64 id = 2 [(buf.validate.field).int64.gt = 0];
  string patch_type = 3 [(buf.validate.field).string.min_len = 1];
  string payload = 4 [(buf.validate.field).string = {min_len: 1, max_len: 1048576}];
}

enum ComposeMountType {
  COMPOSE_MOUNT_TYPE_UNSPECIFIED = 0;
  COMPOSE_MOUNT_TYPE_VOLUME = 1;
  COMPOSE_MOUNT_TYPE_BIND = 2;
  COMPOSE_MOUNT_TYPE_FILE = 3;
}

enum ComposePatchType {
  COMPOSE_PATCH_TYPE_UNSPECIFIED = 0;
  COMPOSE_PATCH_TYPE_UPDATE = 1;
  COMPOSE_PATCH_TYPE_DELETE = 2;
}

message ComposeMount {
  int64 id = 1;
  ComposeMountType mount_type = 2;
  optional string host_path = 3;
  optional string volume_name = 4;
  optional string file_path = 5;
  // Inline file content for FILE mounts.
  optional string content = 6;
  string mount_path = 7;
  int64 compose_id = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}

message ComposePatch {
  int64 id = 1;
  ComposePatchType patch_type = 2;
  string file_path = 3;
  bool enabled = 4;
  // Patch file body (raw text).
  string content = 5;
  int64 compose_id = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message ComposeListMountsRequest {
  int64 compose_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ComposeListMountsResponse {
  repeated ComposeMount mounts = 1;
}

message ComposeCreateMountRequest {
  int64 compose_id = 1 [(buf.validate.field).int64.gt = 0];
  ComposeMountType mount_type = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional string host_path = 3;
  optional string volume_name = 4;
  optional string file_path = 5;
  // Inline file content for FILE mounts.
  optional string content = 6 [(buf.validate.field).string.max_len = 1048576];
  string mount_path = 7 [(buf.validate.field).string.min_len = 1];
}

message ComposeCreateMountResponse {
  ComposeMount mount = 1;
}

message ComposeUpdateMountRequest {
  int64 compose_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  ComposeMountType mount_type = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional string host_path = 4;
  optional string volume_name = 5;
  optional string file_path = 6;
  // Inline file content for FILE mounts.
  optional string content = 7 [(buf.validate.field).string.max_len = 1048576];
  string mount_path = 8 [(buf.validate.field).string.min_len = 1];
}

message ComposeUpdateMountResponse {
  ComposeMount mount = 1;
}

message ComposeListPatchesRequest {
  int64 compose_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ComposeListPatchesResponse {
  repeated ComposePatch patches = 1;
}

message ComposeCreatePatchRequest {
  int64 compose_id = 1 [(buf.validate.field).int64.gt = 0];
  ComposePatchType patch_type = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string file_path = 3 [(buf.validate.field).string.min_len = 1];
  bool enabled = 4;
  // Patch file body (raw text); cleared for DELETE patches.
  string content = 5 [(buf.validate.field).string.max_len = 1048576];
}

message ComposeCreatePatchResponse {
  ComposePatch patch = 1;
}

message ComposeUpdatePatchRequest {
  int64 compose_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  ComposePatchType patch_type = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string file_path = 4 [(buf.validate.field).string.min_len = 1];
  bool enabled = 5;
  // Patch file body (raw text); cleared for DELETE patches.
  string content = 6 [(buf.validate.field).string.max_len = 1048576];
}

message ComposeUpdatePatchResponse {
  ComposePatch patch = 1;
}
