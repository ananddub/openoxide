syntax = "proto3";

package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

service ApplicationService {
  rpc GetApplication(GetApplicationRequest) returns (Application);
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse);
  rpc CreateApplication(CreateApplicationRequest) returns (Application);
  rpc UpdateApplication(UpdateApplicationRequest) returns (Application);
  rpc DeleteApplication(DeleteApplicationRequest) returns (Empty);
  rpc ImportApplication(ImportApplicationRequest) returns (Application);
  rpc ExportApplication(ExportApplicationRequest) returns (ApplicationExport);
  rpc SetGithubSource(SetGithubSourceRequest) returns (Application);
  rpc SetGitlabSource(SetGitlabSourceRequest) returns (Application);
  rpc SetBitbucketSource(SetBitbucketSourceRequest) returns (Application);
  rpc SetGiteaSource(SetGiteaSourceRequest) returns (Application);
  rpc SetCustomGitSource(SetCustomGitSourceRequest) returns (Application);
  rpc SetDockerSource(SetDockerSourceRequest) returns (Application);
  rpc SetDropSource(SetDropSourceRequest) returns (Application);
  rpc UploadSource(stream UploadSourceRequest) returns (Application);
  rpc UpdateBuildConfig(UpdateBuildConfigRequest) returns (Application);
  rpc UpdateResourceConfig(UpdateResourceConfigRequest) returns (Application);
  rpc UpdatePreviewConfig(UpdatePreviewConfigRequest) returns (Application);
  rpc Deploy(ApplicationOperationRequest) returns (ApplicationOperation);
  rpc Redeploy(ApplicationOperationRequest) returns (ApplicationOperation);
  rpc Rebuild(ApplicationOperationRequest) returns (ApplicationOperation);
  rpc Reload(ApplicationOperationRequest) returns (ApplicationOperation);
  rpc Start(ApplicationOperationRequest) returns (ApplicationOperation);
  rpc Stop(ApplicationOperationRequest) returns (ApplicationOperation);
  rpc Cancel(ApplicationOperationRequest) returns (Empty);
  rpc RotateWebhookToken(ApplicationOperationRequest) returns (ApplicationWebhookToken);
  rpc MoveApplication(MoveApplicationRequest) returns (Application);
  rpc ClearDeploymentHistory(ApplicationOperationRequest) returns (Empty);
  rpc CleanupDeploymentQueue(ApplicationOperationRequest) returns (Empty);
  rpc ForceKillDeployment(ApplicationOperationRequest) returns (Empty);
  rpc ListRollbacks(ListRollbacksRequest) returns (ListRollbacksResponse);
  rpc TriggerRollback(TriggerRollbackRequest) returns (RollbackTrigger);
  rpc DeleteRollback(DeleteRollbackRequest) returns (Empty);
  rpc ListDependencies(ApplicationOperationRequest) returns (ApplicationDependencies);
  rpc ListApplicationPorts(ResourceListRequest) returns (ApplicationPorts);
  rpc ListApplicationMounts(ResourceListRequest) returns (ApplicationMounts);
  rpc ListApplicationNetworks(ResourceListRequest) returns (ApplicationNetworks);
  rpc ListApplicationPatches(ResourceListRequest) returns (ApplicationPatches);
  rpc ListApplicationMiddlewares(ResourceListRequest) returns (ApplicationMiddlewares);
  rpc ListApplicationRedirects(ResourceListRequest) returns (ApplicationRedirects);
  rpc ListApplicationSecurity(ResourceListRequest) returns (ApplicationSecurity);
  rpc ListPorts(ApplicationListPortsRequest) returns (ApplicationListPortsResponse);
  rpc CreatePort(ApplicationCreatePortRequest) returns (ApplicationCreatePortResponse);
  rpc UpdatePort(ApplicationUpdatePortRequest) returns (ApplicationUpdatePortResponse);
  rpc DeletePort(ApplicationDeletePortRequest) returns (Empty);
  rpc ListMounts(ApplicationListMountsRequest) returns (ApplicationListMountsResponse);
  rpc CreateMount(ApplicationCreateMountRequest) returns (ApplicationCreateMountResponse);
  rpc UpdateMount(ApplicationUpdateMountRequest) returns (ApplicationUpdateMountResponse);
  rpc DeleteMount(ApplicationDeleteMountRequest) returns (Empty);
  rpc ListPatches(ApplicationListPatchesRequest) returns (ApplicationListPatchesResponse);
  rpc CreatePatch(ApplicationCreatePatchRequest) returns (ApplicationCreatePatchResponse);
  rpc UpdatePatch(ApplicationUpdatePatchRequest) returns (ApplicationUpdatePatchResponse);
  rpc DeletePatch(ApplicationDeletePatchRequest) returns (Empty);
  rpc ListMiddlewares(ApplicationListMiddlewaresRequest) returns (ApplicationListMiddlewaresResponse);
  rpc CreateMiddleware(ApplicationCreateMiddlewareRequest) returns (ApplicationCreateMiddlewareResponse);
  rpc UpdateMiddleware(ApplicationUpdateMiddlewareRequest) returns (ApplicationUpdateMiddlewareResponse);
  rpc DeleteMiddleware(ApplicationDeleteMiddlewareRequest) returns (Empty);
  rpc ListRedirects(ApplicationListRedirectsRequest) returns (ApplicationListRedirectsResponse);
  rpc CreateRedirect(ApplicationCreateRedirectRequest) returns (ApplicationCreateRedirectResponse);
  rpc UpdateRedirect(ApplicationUpdateRedirectRequest) returns (ApplicationUpdateRedirectResponse);
  rpc DeleteRedirect(ApplicationDeleteRedirectRequest) returns (Empty);
  rpc GetSecurity(ApplicationGetSecurityRequest) returns (ApplicationGetSecurityResponse);
  rpc CreateSecurity(ApplicationCreateSecurityRequest) returns (ApplicationCreateSecurityResponse);
  rpc UpdateSecurity(ApplicationUpdateSecurityRequest) returns (ApplicationUpdateSecurityResponse);
  rpc DeleteSecurity(ApplicationDeleteSecurityRequest) returns (Empty);
  rpc UpdateNetworks(ApplicationUpdateNetworksRequest) returns (ApplicationUpdateNetworksResponse);
}

enum ApplicationSourceType {
  APPLICATION_SOURCE_TYPE_UNSPECIFIED = 0;
  APPLICATION_SOURCE_TYPE_GITHUB = 1;
  APPLICATION_SOURCE_TYPE_GITLAB = 2;
  APPLICATION_SOURCE_TYPE_BITBUCKET = 3;
  APPLICATION_SOURCE_TYPE_GITEA = 4;
  APPLICATION_SOURCE_TYPE_CUSTOM_GIT = 5;
  APPLICATION_SOURCE_TYPE_DOCKER = 6;
  APPLICATION_SOURCE_TYPE_DROP = 7;
}
enum ApplicationBuildType {
  APPLICATION_BUILD_TYPE_UNSPECIFIED = 0;
  APPLICATION_BUILD_TYPE_BUILDPACKS = 1;
  APPLICATION_BUILD_TYPE_DOCKERFILE = 2;
  APPLICATION_BUILD_TYPE_NIXPACKS = 3;
  APPLICATION_BUILD_TYPE_HEROKU = 4;
  APPLICATION_BUILD_TYPE_PAKETO = 5;
  APPLICATION_BUILD_TYPE_RAILPACK = 6;
  APPLICATION_BUILD_TYPE_STATIC = 7;
}

message Application {
  int64 id = 1;
  string name = 2;
  optional string description = 3;
  string app_name = 4;
  ApplicationSourceType source_type = 5;
  ApplicationBuildType build_type = 6;
  string status = 7;
  optional string last_error = 8;
  string trigger_type = 9;
  int64 environment_id = 10;
  optional int64 server_id = 11;
  optional int64 build_server_id = 12;
  optional int64 registry_id = 13;
  repeated string network_ids = 14;
  bool detach_rustploy_network = 15;
  optional string env_var = 16;
  optional string icon = 17;
  optional string repository = 18;
  optional string owner = 19;
  optional string branch = 20;
  optional string docker_image = 21;
  optional string registry_url = 22;
  optional string custom_git_url = 23;
  optional string custom_git_branch = 24;
  optional string preview_wildcard = 25;
  optional int64 preview_port = 26;
  int64 created_at = 27;
  int64 updated_at = 28;
  // Build/resource round-trip fields: the settings cards read these back after save; without them every card re-rendered blank defaults.
  optional string dockerfile = 29;
  optional string docker_context_path = 30;
  optional string docker_build_stage = 31;
  optional string publish_directory = 32;
  optional bool is_static_spa = 33;
  optional string railpack_version = 34;
  optional string heroku_version = 35;
  optional string build_path = 36;
  optional string drop_build_path = 37;
  optional bool clean_cache = 38;
  optional bool auto_deploy = 39;
  optional string memory_reservation = 40;
  optional string memory_limit = 41;
  optional string cpu_reservation = 42;
  optional string cpu_limit = 43;
  optional int64 replicas = 44;
  optional string command = 45;
  optional string args = 46;
  optional string watch_paths = 47;
  optional bool enable_submodules = 48;
}
message GetApplicationRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}
message ListApplicationsRequest {
  int64 environment_id = 1 [(buf.validate.field).int64.gt = 0];
}
message ListApplicationsResponse {
  repeated Application applications = 1;
}
message CreateApplicationRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  optional string description = 2;
  int64 environment_id = 3 [(buf.validate.field).int64.gt = 0];
  optional int64 server_id = 4 [(buf.validate.field).int64.gt = 0];
  ApplicationSourceType source_type = 5;
  ApplicationBuildType build_type = 6;
}
message UpdateApplicationRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string name = 2;
  optional string description = 3;
  optional ApplicationBuildType build_type = 4;
  optional string trigger_type = 5;
  optional string env_var = 6;
  optional int64 server_id = 7;
  optional int64 build_server_id = 8;
  optional int64 registry_id = 9;
  repeated string network_ids = 10;
  optional bool detach_rustploy_network = 11;
}
message DeleteApplicationRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}
message ImportApplicationRequest {
  string archive = 1 [(buf.validate.field).string = {min_len: 1, max_len: 10485760}];
}
message ExportApplicationRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  bool include_secrets = 2;
}
message ApplicationExport {
  string format = 1;
  int64 schema_version = 2;
  string archive = 3;
}
message SetGithubSourceRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string repository = 2 [(buf.validate.field).string.min_len = 1];
  string owner = 3 [(buf.validate.field).string.min_len = 1];
  optional string branch = 4;
  optional string build_path = 5;
  optional int64 provider_id = 6;
  optional bool auto_deploy = 7;
}
message SetGitlabSourceRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string repository = 2 [(buf.validate.field).string.min_len = 1];
  string owner = 3 [(buf.validate.field).string.min_len = 1];
  optional string branch = 4;
  optional string build_path = 5;
  optional string path_namespace = 6;
  optional int64 provider_id = 7;
  optional int64 project_id = 8;
}
message SetBitbucketSourceRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string repository = 2 [(buf.validate.field).string.min_len = 1];
  string owner = 3 [(buf.validate.field).string.min_len = 1];
  optional string branch = 4;
  optional string build_path = 5;
  optional string repository_slug = 6;
  optional int64 provider_id = 7;
}
message SetGiteaSourceRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string repository = 2 [(buf.validate.field).string.min_len = 1];
  string owner = 3 [(buf.validate.field).string.min_len = 1];
  optional string branch = 4;
  optional string build_path = 5;
  optional int64 provider_id = 6;
}
message SetCustomGitSourceRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string url = 2 [(buf.validate.field).string.uri = true];
  optional string branch = 3;
  optional string build_path = 4;
  optional int64 ssh_key_id = 5;
}
message SetDockerSourceRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string image = 2 [(buf.validate.field).string.min_len = 1];
  optional string username = 3;
  optional string password = 4;
  optional string registry_url = 5;
}
message SetDropSourceRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string build_path = 2;
}
message DropSourceHeader {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  optional string build_path = 2;
}
message UploadSourceRequest {
  oneof payload {
    DropSourceHeader header = 1;
    bytes chunk = 2 [(buf.validate.field).bytes = {min_len: 1, max_len: 4194304}];
  }
}
message UpdateBuildConfigRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string build_args = 2;
  optional string build_secrets = 3;
  optional string dockerfile = 4;
  optional string context_path = 5;
  optional string build_stage = 6;
  optional string publish_directory = 7;
  optional bool static_spa = 8;
  optional bool create_env_file = 9;
  optional string command = 10;
  optional string args = 11;
  optional string build_path = 12;
  optional bool clean_cache = 13;
  optional bool enable_submodules = 14;
  optional string watch_paths = 15;
  // Railpack/Heroku version pins and the autodeploy switch (service_git) — the build-settings and deploy-settings cards persist through here.
  optional string railpack_version = 16;
  optional string heroku_version = 17;
  optional bool auto_deploy = 18;
}
message UpdateResourceConfigRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string memory_reservation = 2;
  optional string memory_limit = 3;
  optional string cpu_reservation = 4;
  optional string cpu_limit = 5;
  optional int64 replicas = 6;
}
message UpdatePreviewConfigRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string preview_env = 2;
  optional string build_args = 3;
  optional string build_secrets = 4;
  optional string labels = 5;
  optional string wildcard = 6;
  optional int64 port = 7 [(buf.validate.field).int64 = {gte: 1, lte: 65535}];
  bool https = 8;
  string path = 9;
  string certificate_type = 10;
  optional string custom_cert_resolver = 11;
  int64 limit = 12;
  bool active = 13;
  bool require_collaborator_permissions = 14;
}
message ApplicationOperationRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}
message ApplicationOperation {
  Application application = 1;
  string operation = 2;
}
message ApplicationWebhookToken {
  string token = 1;
}
message MoveApplicationRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  int64 target_environment_id = 2 [(buf.validate.field).int64.gt = 0];
}
message ListRollbacksRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
}
message ListRollbacksResponse {
  repeated Rollback rollbacks = 1;
}
message Rollback {
  int64 id = 1;
  int64 application_id = 2;
  string status = 3;
  optional string commit = 4;
  int64 created_at = 5;
}
message TriggerRollbackRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 rollback_id = 2 [(buf.validate.field).int64.gt = 0];
}
message RollbackTrigger {
  int64 rollback_id = 1;
  string status = 2;
}
message DeleteRollbackRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 rollback_id = 2 [(buf.validate.field).int64.gt = 0];
}
message ApplicationDependencies {
  repeated string items = 1;
}
message ResourceListRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
}
message ApplicationPorts {
  repeated string items = 1;
}
message ApplicationMounts {
  repeated string items = 1;
}
message ApplicationNetworks {
  repeated string items = 1;
}
message ApplicationPatches {
  repeated string items = 1;
}
message ApplicationMiddlewares {
  repeated string items = 1;
}
message ApplicationRedirects {
  repeated string items = 1;
}
message ApplicationSecurity {
  repeated string items = 1;
}

// ── Sub-resource enums (closed sets from the request DTOs) ─────────────

enum ApplicationPortProtocol {
  APPLICATION_PORT_PROTOCOL_UNSPECIFIED = 0;
  APPLICATION_PORT_PROTOCOL_TCP = 1;
  APPLICATION_PORT_PROTOCOL_UDP = 2;
}

enum ApplicationPortPublishMode {
  APPLICATION_PORT_PUBLISH_MODE_UNSPECIFIED = 0;
  APPLICATION_PORT_PUBLISH_MODE_HOST = 1;
  APPLICATION_PORT_PUBLISH_MODE_INGRESS = 2;
}

enum ApplicationMountType {
  APPLICATION_MOUNT_TYPE_UNSPECIFIED = 0;
  APPLICATION_MOUNT_TYPE_VOLUME = 1;
  APPLICATION_MOUNT_TYPE_BIND = 2;
  APPLICATION_MOUNT_TYPE_FILE = 3;
}

enum ApplicationPatchType {
  APPLICATION_PATCH_TYPE_UNSPECIFIED = 0;
  APPLICATION_PATCH_TYPE_CREATE = 1;
  APPLICATION_PATCH_TYPE_UPDATE = 2;
  APPLICATION_PATCH_TYPE_DELETE = 3;
}

enum ApplicationMiddlewareType {
  APPLICATION_MIDDLEWARE_TYPE_UNSPECIFIED = 0;
  APPLICATION_MIDDLEWARE_TYPE_COMPRESS = 1;
  APPLICATION_MIDDLEWARE_TYPE_HEADERS = 2;
  APPLICATION_MIDDLEWARE_TYPE_RATE_LIMIT = 3;
  APPLICATION_MIDDLEWARE_TYPE_IP_ALLOWLIST = 4;
}

// ── Sub-resource entities ──────────────────────────────────────────────

message ApplicationPort {
  int64 id = 1;
  int64 published_port = 2;
  int64 target_port = 3;
  ApplicationPortProtocol protocol = 4;
  ApplicationPortPublishMode publish_mode = 5;
  int64 application_id = 6;
  int64 created_at = 7;
}

message ApplicationMount {
  int64 id = 1;
  ApplicationMountType mount_type = 2;
  optional string host_path = 3;
  optional string volume_name = 4;
  optional string file_path = 5;
  // Inline file content for FILE mounts.
  optional string content = 6;
  string mount_path = 7;
  int64 application_id = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}

message ApplicationPatch {
  int64 id = 1;
  ApplicationPatchType patch_type = 2;
  string file_path = 3;
  bool enabled = 4;
  // Patch file body (raw text); cleared for DELETE patches.
  string content = 5;
  int64 application_id = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message ApplicationMiddlewareHeader {
  string name = 1;
  string value = 2;
}

message ApplicationMiddleware {
  int64 id = 1;
  int64 application_id = 2;
  string name = 3;
  ApplicationMiddlewareType middleware_type = 4;
  bool enabled = 5;
  repeated ApplicationMiddlewareHeader headers = 6;
  optional int64 average = 7;
  optional int64 burst = 8;
  repeated string source_ranges = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

message ApplicationRedirect {
  int64 id = 1;
  string regex = 2;
  string replacement = 3;
  bool permanent = 4;
  // Opaque Traefik routing-config key.
  optional int64 unique_config_key = 5;
  int64 application_id = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message ApplicationSecurityRule {
  int64 id = 1;
  string username = 2;
  // Password material is never echoed back; presence only.
  bool has_password = 3;
  int64 application_id = 4;
  int64 created_at = 5;
}

// ── Ports ──────────────────────────────────────────────────────────────

message ApplicationListPortsRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ApplicationListPortsResponse {
  repeated ApplicationPort ports = 1;
}

message ApplicationCreatePortRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 published_port = 2;
  int64 target_port = 3;
  ApplicationPortProtocol protocol = 4 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  ApplicationPortPublishMode publish_mode = 5 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

message ApplicationCreatePortResponse {
  ApplicationPort port = 1;
}

message ApplicationUpdatePortRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  int64 published_port = 3;
  int64 target_port = 4;
  ApplicationPortProtocol protocol = 5 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  ApplicationPortPublishMode publish_mode = 6 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

message ApplicationUpdatePortResponse {
  ApplicationPort port = 1;
}

message ApplicationDeletePortRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
}

// ── Mounts ─────────────────────────────────────────────────────────────

message ApplicationListMountsRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ApplicationListMountsResponse {
  repeated ApplicationMount mounts = 1;
}

message ApplicationCreateMountRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  ApplicationMountType mount_type = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional string host_path = 3;
  optional string volume_name = 4;
  optional string file_path = 5;
  // Inline file content for FILE mounts.
  optional string content = 6 [(buf.validate.field).string.max_len = 1048576];
  string mount_path = 7 [(buf.validate.field).string.min_len = 1];
}

message ApplicationCreateMountResponse {
  ApplicationMount mount = 1;
}

message ApplicationUpdateMountRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  ApplicationMountType mount_type = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional string host_path = 4;
  optional string volume_name = 5;
  optional string file_path = 6;
  // Inline file content for FILE mounts.
  optional string content = 7 [(buf.validate.field).string.max_len = 1048576];
  string mount_path = 8 [(buf.validate.field).string.min_len = 1];
}

message ApplicationUpdateMountResponse {
  ApplicationMount mount = 1;
}

message ApplicationDeleteMountRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
}

// ── Patches ────────────────────────────────────────────────────────────

message ApplicationListPatchesRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ApplicationListPatchesResponse {
  repeated ApplicationPatch patches = 1;
}

message ApplicationCreatePatchRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  ApplicationPatchType patch_type = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string file_path = 3 [(buf.validate.field).string.min_len = 1];
  bool enabled = 4;
  // Patch file body (raw text); cleared for DELETE patches.
  string content = 5 [(buf.validate.field).string.max_len = 1048576];
}

message ApplicationCreatePatchResponse {
  ApplicationPatch patch = 1;
}

message ApplicationUpdatePatchRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  ApplicationPatchType patch_type = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string file_path = 4 [(buf.validate.field).string.min_len = 1];
  bool enabled = 5;
  // Patch file body (raw text); cleared for DELETE patches.
  string content = 6 [(buf.validate.field).string.max_len = 1048576];
}

message ApplicationUpdatePatchResponse {
  ApplicationPatch patch = 1;
}

message ApplicationDeletePatchRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
}

// ── Middlewares ────────────────────────────────────────────────────────

message ApplicationListMiddlewaresRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ApplicationListMiddlewaresResponse {
  repeated ApplicationMiddleware middlewares = 1;
}

message ApplicationCreateMiddlewareRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  ApplicationMiddlewareType middleware_type = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  bool enabled = 4;
  repeated ApplicationMiddlewareHeader headers = 5;
  optional int64 average = 6;
  optional int64 burst = 7;
  repeated string source_ranges = 8;
}

message ApplicationCreateMiddlewareResponse {
  ApplicationMiddleware middleware = 1;
}

message ApplicationUpdateMiddlewareRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  string name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  ApplicationMiddlewareType middleware_type = 4 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  bool enabled = 5;
  repeated ApplicationMiddlewareHeader headers = 6;
  optional int64 average = 7;
  optional int64 burst = 8;
  repeated string source_ranges = 9;
}

message ApplicationUpdateMiddlewareResponse {
  ApplicationMiddleware middleware = 1;
}

message ApplicationDeleteMiddlewareRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
}

// ── Redirects ──────────────────────────────────────────────────────────

message ApplicationListRedirectsRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ApplicationListRedirectsResponse {
  repeated ApplicationRedirect redirects = 1;
}

message ApplicationCreateRedirectRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  string regex = 2 [(buf.validate.field).string.min_len = 1];
  string replacement = 3 [(buf.validate.field).string.min_len = 1];
  bool permanent = 4;
  // Opaque Traefik routing-config key.
  optional int64 unique_config_key = 5;
}

message ApplicationCreateRedirectResponse {
  ApplicationRedirect redirect = 1;
}

message ApplicationUpdateRedirectRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  string regex = 3 [(buf.validate.field).string.min_len = 1];
  string replacement = 4 [(buf.validate.field).string.min_len = 1];
  bool permanent = 5;
  // Opaque Traefik routing-config key.
  optional int64 unique_config_key = 6;
}

message ApplicationUpdateRedirectResponse {
  ApplicationRedirect redirect = 1;
}

message ApplicationDeleteRedirectRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
}

// ── Security ───────────────────────────────────────────────────────────

message ApplicationGetSecurityRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
}

// `get_security` returns the application's whole rule set, not a single row.
message ApplicationGetSecurityResponse {
  repeated ApplicationSecurityRule security = 1;
}

message ApplicationCreateSecurityRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  string username = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string password = 3 [(buf.validate.field).string.min_len = 1];
}

message ApplicationCreateSecurityResponse {
  ApplicationSecurityRule security = 1;
}

message ApplicationUpdateSecurityRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  string username = 3 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string password = 4 [(buf.validate.field).string.min_len = 1];
}

message ApplicationUpdateSecurityResponse {
  ApplicationSecurityRule security = 1;
}

message ApplicationDeleteSecurityRequest {
  int64 application_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
}

