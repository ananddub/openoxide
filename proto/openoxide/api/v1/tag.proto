syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

service TagService {
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc GetTag(GetTagRequest) returns (GetTagResponse);
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
  rpc UpdateTag(UpdateTagRequest) returns (UpdateTagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (Empty);
  rpc AddTag(AddTagRequest) returns (AddTagResponse);
  rpc RemoveTag(RemoveTagRequest) returns (Empty);
  rpc ListProjectTags(ListProjectTagsRequest) returns (ListProjectTagsResponse);
  rpc AttachProjectTag(AttachProjectTagRequest) returns (AttachProjectTagResponse);
  rpc DetachProjectTag(DetachProjectTagRequest) returns (Empty);
}

message Tag {
  int64 id = 1;
  string name = 2;
  // Free-form hex color, e.g. "#6b7280".
  string color = 3;
  int64 organization_id = 4;
  int64 created_at = 5;
}

message ListTagsRequest {}

message ListTagsResponse {
  repeated Tag tags = 1;
}

message GetTagRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetTagResponse {
  Tag tag = 1;
}

message CreateTagRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 255];
  string color = 2 [(buf.validate.field).string.min_len = 1];
  optional int64 organization_id = 3 [(buf.validate.field).int64.gt = 0];
}

message CreateTagResponse {
  Tag tag = 1;
}

message UpdateTagRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string name = 2 [(buf.validate.field).string.max_len = 255];
  optional string color = 3;
}

message UpdateTagResponse {
  Tag tag = 1;
}

message DeleteTagRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message AddTagRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message AddTagResponse {
  bool success = 1;
}

message RemoveTagRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message ListProjectTagsRequest {
  int64 project_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ListProjectTagsResponse {
  repeated Tag tags = 1;
}

message AttachProjectTagRequest {
  int64 project_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 tag_id = 2 [(buf.validate.field).int64.gt = 0];
}

message AttachProjectTagResponse {
  bool success = 1;
}

message DetachProjectTagRequest {
  int64 project_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 tag_id = 2 [(buf.validate.field).int64.gt = 0];
}
