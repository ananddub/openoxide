syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

// Sole Docker-management owner service; absorbs the former GlobalOperationsApiService and GlobalOperationsService surface; `server_id` selects the target engine, absent means the local Agent.
service GlobalService {
  // Client-streaming upload: exactly one header chunk first, then byte chunks.
  rpc UploadFile(stream GlobalUploadFileRequest) returns (GlobalUploadFileResponse);
  // Download a file from a container by container_id and path; optional server_id selects the engine. Returns raw bytes.
  rpc DownloadFile(GlobalDownloadFileRequest) returns (GlobalDownloadFileResponse);
  // Twin of UploadFile kept for method-name compatibility with the former GlobalOperationsService.
  rpc UploadContainerFile(stream GlobalUploadContainerFileRequest) returns (GlobalUploadContainerFileResponse);
  // Download a file from a container (compat twin) by container_id and path; optional server_id. Returns raw bytes.
  rpc DownloadContainerFile(GlobalDownloadContainerFileRequest) returns (GlobalDownloadContainerFileResponse);
  // List Docker containers on an engine; optional server_id (absent means local Agent).
  rpc ListContainers(GlobalListContainersRequest) returns (GlobalListContainersResponse);
  // List Docker images on an engine; optional server_id (absent means local Agent).
  rpc ListImages(GlobalListImagesRequest) returns (GlobalListImagesResponse);
  // List Docker networks on an engine; optional server_id (absent means local Agent).
  rpc ListNetworks(GlobalListNetworksRequest) returns (GlobalListNetworksResponse);
  // List Docker volumes on an engine; optional server_id (absent means local Agent).
  rpc ListVolumes(GlobalListVolumesRequest) returns (GlobalListVolumesResponse);
  // Inspect a container by container_id; optional server_id. Returns raw `docker inspect` JSON.
  rpc InspectContainer(GlobalInspectContainerRequest) returns (GlobalInspectContainerResponse);
  // Inspect an image by image_id (id or reference); optional server_id. Returns raw `docker inspect` JSON.
  rpc InspectImage(GlobalInspectImageRequest) returns (GlobalInspectImageResponse);
  // Inspect a network by network_id; optional server_id. Returns raw `docker inspect` JSON.
  rpc InspectNetwork(GlobalInspectNetworkRequest) returns (GlobalInspectNetworkResponse);
  // Inspect a volume by volume_id; optional server_id. Returns raw `docker inspect` JSON.
  rpc InspectVolume(GlobalInspectVolumeRequest) returns (GlobalInspectVolumeResponse);
  // Run a lifecycle action on a container by container_id: action (GlobalContainerAction START/STOP/RESTART/KILL/PAUSE/UNPAUSE); optional server_id.
  rpc ContainerAction(GlobalContainerActionRequest) returns (GlobalContainerActionResponse);
  // Remove a container by container_id; optional force and volumes flags; optional server_id.
  rpc RemoveContainer(GlobalRemoveContainerRequest) returns (Empty);
  // Twin of RemoveContainer kept for method-name compatibility with the former GlobalOperationsService.
  rpc DeleteContainer(GlobalDeleteContainerRequest) returns (Empty);
  // Get Docker disk usage (`docker system df`) on an engine; optional server_id. Returns raw JSON.
  rpc DiskUsage(GlobalDiskUsageRequest) returns (GlobalDiskUsageResponse);
  // Prune Docker resources; booleans select which to prune: containers, images, networks, volumes; optional server_id.
  rpc Prune(GlobalPruneRequest) returns (GlobalPruneResponse);
}

// Lifecycle actions accepted by `container_action` (ContainerActionDto).
enum GlobalContainerAction {
  GLOBAL_CONTAINER_ACTION_UNSPECIFIED = 0;
  GLOBAL_CONTAINER_ACTION_START = 1;
  GLOBAL_CONTAINER_ACTION_STOP = 2;
  GLOBAL_CONTAINER_ACTION_RESTART = 3;
  GLOBAL_CONTAINER_ACTION_KILL = 4;
  GLOBAL_CONTAINER_ACTION_PAUSE = 5;
  GLOBAL_CONTAINER_ACTION_UNPAUSE = 6;
}

// `docker ps` projection; every column arrives as the CLI-formatted string.
message GlobalContainer {
  string id = 1;
  string names = 2;
  string image = 3;
  string command = 4;
  string created_at = 5;
  string running_for = 6;
  string ports = 7;
  string status = 8;
  string state = 9;
  string size = 10;
  // Labels as the CLI-formatted string, not a JSON document.
  string labels = 11;
  string mounts = 12;
  string networks = 13;
}

// `docker images` projection; every column is a CLI-formatted string.
message GlobalImage {
  string id = 1;
  string repository = 2;
  string tag = 3;
  string digest = 4;
  string created_at = 5;
  string created_since = 6;
  string size = 7;
  string shared_size = 8;
  string unique_size = 9;
  string containers = 10;
}

// `docker network ls` projection; every column is a CLI-formatted string.
message GlobalNetwork {
  string id = 1;
  string name = 2;
  string driver = 3;
  string scope = 4;
  // i64-as-bool rendered by the CLI ("true"/"false" strings).
  string ipv6 = 5;
  string internal = 6;
  string labels = 7;
  string created_at = 8;
}

// `docker volume ls` projection; every column is a CLI-formatted string.
message GlobalVolume {
  string name = 1;
  string driver = 2;
  string scope = 3;
  string mountpoint = 4;
  string labels = 5;
  string availability = 6;
  string group = 7;
  string links = 8;
  string size = 9;
}

message GlobalDockerOutput {
  string stdout = 1;
  string stderr = 2;
}

// First (and only metadata) chunk of an upload stream; the destination inside the container is joined as `<destination>/<filename>`.
message GlobalUploadFileHeader {
  optional int64 server_id = 1 [(buf.validate.field).int64.gt = 0];
  string container_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[a-zA-Z0-9._:/@+-]+$"}];
  string destination = 3 [(buf.validate.field).string = {min_len: 1, max_len: 4096}];
  string filename = 4 [(buf.validate.field).string = {min_len: 1, max_len: 4096}];
}

message GlobalUploadFileRequest {
  oneof payload {
    GlobalUploadFileHeader header = 1;
    bytes chunk = 2 [(buf.validate.field).bytes = {min_len: 1, max_len: 4194304}];
  }
}

message GlobalUploadFileResponse {
  bool success = 1;
  GlobalDockerOutput output = 2;
}

message GlobalDownloadFileRequest {
  optional int64 server_id = 1 [(buf.validate.field).int64.gt = 0];
  string container_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[a-zA-Z0-9._:/@+-]+$"}];
  string path = 3 [(buf.validate.field).string = {min_len: 1, max_len: 4096}];
}

message GlobalDownloadFileResponse {
  // Raw file bytes; the old handler base64-wrapped them in a JSON payload.
  bytes content = 1;
  string path = 2;
}

message GlobalUploadContainerFileHeader {
  optional int64 server_id = 1 [(buf.validate.field).int64.gt = 0];
  string container_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[a-zA-Z0-9._:/@+-]+$"}];
  string destination = 3 [(buf.validate.field).string = {min_len: 1, max_len: 4096}];
  string filename = 4 [(buf.validate.field).string = {min_len: 1, max_len: 4096}];
}

message GlobalUploadContainerFileRequest {
  oneof payload {
    GlobalUploadContainerFileHeader header = 1;
    bytes chunk = 2 [(buf.validate.field).bytes = {min_len: 1, max_len: 4194304}];
  }
}

message GlobalUploadContainerFileResponse {
  bool success = 1;
  GlobalDockerOutput output = 2;
}

message GlobalDownloadContainerFileRequest {
  optional int64 server_id = 1 [(buf.validate.field).int64.gt = 0];
  string container_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[a-zA-Z0-9._:/@+-]+$"}];
  string path = 3 [(buf.validate.field).string = {min_len: 1, max_len: 4096}];
}

message GlobalDownloadContainerFileResponse {
  bytes content = 1;
  string path = 2;
}

message GlobalListContainersRequest {
  optional int64 server_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GlobalListContainersResponse {
  repeated GlobalContainer containers = 1;
}

message GlobalListImagesRequest {
  optional int64 server_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GlobalListImagesResponse {
  repeated GlobalImage images = 1;
}

message GlobalListNetworksRequest {
  optional int64 server_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GlobalListNetworksResponse {
  repeated GlobalNetwork networks = 1;
}

message GlobalListVolumesRequest {
  optional int64 server_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GlobalListVolumesResponse {
  repeated GlobalVolume volumes = 1;
}

message GlobalInspectContainerRequest {
  optional int64 server_id = 1 [(buf.validate.field).int64.gt = 0];
  string container_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[a-zA-Z0-9._:/@+-]+$"}];
}

message GlobalInspectContainerResponse {
  // Raw `docker inspect` JSON document for the container.
  string data_json = 1;
}

message GlobalInspectImageRequest {
  optional int64 server_id = 1 [(buf.validate.field).int64.gt = 0];
  // Image id or reference (validate_resource_name charset).
  string image_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[a-zA-Z0-9._:/@+-]+$"}];
}

message GlobalInspectImageResponse {
  // Raw `docker inspect` JSON document for the image.
  string data_json = 1;
}

message GlobalInspectNetworkRequest {
  optional int64 server_id = 1 [(buf.validate.field).int64.gt = 0];
  string network_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[a-zA-Z0-9._:/@+-]+$"}];
}

message GlobalInspectNetworkResponse {
  // Raw `docker inspect` JSON document for the network.
  string data_json = 1;
}

message GlobalInspectVolumeRequest {
  optional int64 server_id = 1 [(buf.validate.field).int64.gt = 0];
  string volume_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[a-zA-Z0-9._:/@+-]+$"}];
}

message GlobalInspectVolumeResponse {
  // Raw `docker inspect` JSON document for the volume.
  string data_json = 1;
}

message GlobalContainerActionRequest {
  string container_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[a-zA-Z0-9._:/@+-]+$"}];
  GlobalContainerAction action = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional int64 server_id = 3 [(buf.validate.field).int64.gt = 0];
}

message GlobalContainerActionResponse {
  bool success = 1;
  GlobalDockerOutput output = 2;
}

message GlobalRemoveContainerRequest {
  string container_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[a-zA-Z0-9._:/@+-]+$"}];
  bool force = 2;
  bool volumes = 3;
  optional int64 server_id = 4 [(buf.validate.field).int64.gt = 0];
}

message GlobalDeleteContainerRequest {
  string container_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255, pattern: "^[a-zA-Z0-9._:/@+-]+$"}];
  bool force = 2;
  bool volumes = 3;
  optional int64 server_id = 4 [(buf.validate.field).int64.gt = 0];
}

message GlobalDiskUsageRequest {
  optional int64 server_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GlobalDiskUsageResponse {
  // Raw `docker system df` JSON document.
  string data_json = 1;
}

message GlobalPruneRequest {
  bool containers = 1;
  bool images = 2;
  bool networks = 3;
  bool volumes = 4;
  optional int64 server_id = 5 [(buf.validate.field).int64.gt = 0];
}

message GlobalPruneResponse {
  // One output entry per enabled prune operation, in request order.
  repeated GlobalDockerOutput operations = 1;
}
