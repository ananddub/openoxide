syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

service DeploymentService {
  // List deployments; optional resource_type, resource_id, limit (1..=1000) and offset filters.
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  // Search deployment logs by query text; optional resource_type and resource_id filters.
  rpc SearchLogs(SearchLogsRequest) returns (ListDeploymentsResponse);
  // List all active (not-finished) deployments. No params.
  rpc ListActiveDeployments(Empty) returns (ListDeploymentsResponse);
  // List all currently running deployments. No params.
  rpc ListRunningDeployments(Empty) returns (ListDeploymentsResponse);
  // Get one deployment by id.
  rpc GetDeployment(GetDeploymentRequest) returns (Deployment);
  // Stream live resource stats for an application by id.
  rpc StreamApplicationStats(StreamTargetRequest) returns (stream DeploymentEvent);
  // Stream live resource stats for a compose project by id.
  rpc StreamComposeStats(StreamTargetRequest) returns (stream DeploymentEvent);
  // Stream live resource stats for a database by id.
  rpc StreamDatabaseStats(StreamTargetRequest) returns (stream DeploymentEvent);
  // Stream container logs for target (container handle); optional server_id, tail, filter, timestamps, follow.
  rpc StreamContainerLogs(LogTargetRequest) returns (stream DeploymentEvent);
  // Export container logs for target to a file; optional server_id, tail, filter, timestamps.
  rpc ExportContainerLogs(LogTargetRequest) returns (LogExport);
  // List all containers on the panel host. No params.
  rpc ListContainers(Empty) returns (ContainerList);
  // Stream Swarm service logs for target; optional server_id, tail, filter, timestamps, follow.
  rpc StreamServiceLogs(LogTargetRequest) returns (stream DeploymentEvent);
  // Export Swarm service logs for target to a file; optional server_id, tail, filter, timestamps.
  rpc ExportServiceLogs(LogTargetRequest) returns (LogExport);
  // Stream compose logs for compose_id; optional service, server_id, tail, timestamps, follow.
  rpc StreamComposeLogs(ComposeLogsRequest) returns (stream DeploymentEvent);
  // Export compose logs for compose_id to a file; optional service, server_id, tail, timestamps.
  rpc ExportComposeLogs(ComposeLogsRequest) returns (LogExport);
  // Stream live build/deploy logs for a deployment by id.
  rpc StreamDeploymentLogs(GetDeploymentRequest) returns (stream DeploymentEvent);
  // Cancel an in-progress deployment by id.
  rpc CancelDeployment(CancelDeploymentRequest) returns (Empty);
  // Delete a single deployment record by id.
  rpc DeleteDeployment(GetDeploymentRequest) returns (Empty);
  // Delete all deployment records for an application by id.
  rpc DeleteApplicationDeployments(ResourceTargetRequest) returns (Empty);
  // Delete all deployment records for a compose project by id.
  rpc DeleteComposeDeployments(ResourceTargetRequest) returns (Empty);
  // Delete all deployment records for a database by id.
  rpc DeleteDatabaseDeployments(ResourceTargetRequest) returns (Empty);
  // Delete all deployment records across the panel. No params.
  rpc ClearDeployments(Empty) returns (Empty);
}
message Deployment {
  int64 id = 1;
  string resource_type = 2;
  int64 resource_id = 3;
  string status = 4;
  optional string error = 5;
  optional string logs = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
  // Acting user (0 = system-triggered: webhook/schedule/preview).
  int64 user_id = 9;
  optional string user_email = 10;
}
message ListDeploymentsRequest {
  optional string resource_type = 1;
  optional int64 resource_id = 2 [(buf.validate.field).int64.gt = 0];
  optional int64 limit = 3 [(buf.validate.field).int64 = {gte: 1, lte: 1000}];
  optional int64 offset = 4 [(buf.validate.field).int64.gte = 0];
}
message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
}
message GetDeploymentRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}
message SearchLogsRequest {
  string query = 1 [(buf.validate.field).string = {min_len: 1, max_len: 1000}];
  optional string resource_type = 2;
  optional int64 resource_id = 3;
}
message StreamTargetRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}
// Global live container stats for the monitoring page. No server_id means the panel host's Agent; the stream covers every running container.
message DockerStatsRequest {
  optional int64 server_id = 1;
}
message LogTargetRequest {
  string target = 1 [(buf.validate.field).string.min_len = 1];
  optional int64 server_id = 2;
  optional int64 tail = 3 [(buf.validate.field).int64 = {gte: 1, lte: 100000}];
  optional string filter = 4;
  optional bool timestamps = 5;
  optional bool follow = 6;
}
message ComposeLogsRequest {
  optional int64 compose_id = 1 [(buf.validate.field).int64.gt = 0];
  optional string service = 2 [(buf.validate.field).string.max_len = 255];
  optional int64 server_id = 3 [(buf.validate.field).int64.gt = 0];
  optional bool timestamps = 4;
  optional bool follow = 5;
  optional int64 tail = 6 [(buf.validate.field).int64 = {gte: 1, lte: 100000}];
}
message ResourceTargetRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}
message CancelDeploymentRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}
message DeploymentEvent {
  string type = 1;
  int64 timestamp = 2;
  string payload = 3;
  optional string error = 4;
}
message LogExport {
  string content = 1;
  string file_name = 2;
}
message ContainerList {
  repeated Container containers = 1;
}
message Container {
  string id = 1;
  string name = 2;
  string image = 3;
  string state = 4;
  optional string status = 5;
}
