syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

// AI provider settings, model discovery, compose generation and log analysis.
service AiService {
  // List AI provider settings; optional organization_id scope. API keys are never returned.
  rpc ListSettings(AiListSettingsRequest) returns (AiListSettingsResponse);
  // Get one AI provider setting by id; optional organization_id scope.
  rpc GetSettings(AiGetSettingsRequest) returns (AiGetSettingsResponse);
  // Create an AI provider setting. Required: name, api_url, model; optional api_key (stored, never echoed), is_enabled, organization_id.
  rpc CreateSettings(AiCreateSettingsRequest) returns (AiCreateSettingsResponse);
  // Update an AI provider setting by id (absent fields unchanged; absent api_key keeps the stored key).
  rpc UpdateSettings(AiUpdateSettingsRequest) returns (AiUpdateSettingsResponse);
  // Delete an AI provider setting by id; optional organization_id scope.
  rpc DeleteSettings(AiDeleteSettingsRequest) returns (Empty);
  // List model names offered by a stored provider setting (setting_id); optional organization_id scope.
  rpc ListModels(AiListModelsRequest) returns (AiListModelsResponse);
  // Test a stored AI provider setting by id; optional organization_id scope.
  rpc TestSettings(AiTestSettingsRequest) returns (AiTestSettingsResponse);
  // Discover models against unsaved credentials: required api_url, optional api_key (create-dialog use).
  rpc DiscoverModels(AiDiscoverModelsRequest) returns (AiDiscoverModelsResponse);
  // Test connectivity against unsaved credentials: required api_url and model, optional api_key.
  rpc TestConnection(AiTestConnectionRequest) returns (AiTestConnectionResponse);
  // List past generation runs; optional organization_id scope and limit (1-100).
  rpc ListGenerations(AiListGenerationsRequest) returns (AiListGenerationsResponse);
  // Get one generation run by id; optional organization_id scope.
  rpc GetGeneration(AiGetGenerationRequest) returns (AiGetGenerationResponse);
  // Create a compose generation from a free-form request prompt using provider ai_setting_id.
  rpc CreateGeneration(AiCreateGenerationRequest) returns (AiCreateGenerationResponse);
  // Replace a generation's output after human review by id (full output); optional organization_id scope.
  rpc ReviewGeneration(AiReviewGenerationRequest) returns (AiReviewGenerationResponse);
  // Deploy a reviewed generation by id: pick suggestion_id into environment_id; optional server_id and deploy_now.
  rpc DeployGeneration(AiDeployGenerationRequest) returns (AiDeployGenerationResponse);
  // Analyze logs with provider ai_setting_id: context (AiLogContext BUILD/RUNTIME) over the given logs; returns markdown analysis.
  rpc AnalyzeLogs(AiAnalyzeLogsRequest) returns (AiAnalyzeLogsResponse);
  // Agentic assistant: natural-language request → permission-checked actions.
  rpc Assistant(AiAssistantRequest) returns (AiAssistantResponse);
  // Streaming assistant: emits live thinking/action/result events as the agent
  // works, ending with the reply (or a confirm/choose interaction).
  rpc AssistantStream(AiAssistantRequest) returns (stream AiAssistantEvent);
  // Get the AI diagnosis of a failed deployment (why it failed + whether a
  // config-only fix is available).
  rpc GetBuildDiagnosis(AiGetBuildDiagnosisRequest) returns (AiGetBuildDiagnosisResponse);
  // Apply the AI's config fix for a failed deployment and redeploy.
  rpc ApplyAiFix(AiApplyFixRequest) returns (AiApplyFixResponse);
}

// Provider detected from the configured api_url (AiProviderKind::detect).
enum AiProvider {
  AI_PROVIDER_UNSPECIFIED = 0;
  AI_PROVIDER_OPENAI = 1;
  AI_PROVIDER_ANTHROPIC = 2;
  AI_PROVIDER_GEMINI = 3;
  AI_PROVIDER_OLLAMA = 4;
  AI_PROVIDER_OPENAI_COMPATIBLE = 5;
}

// Log corpus fed to the analyzer (AiLogContextDto).
enum AiLogContext {
  AI_LOG_CONTEXT_UNSPECIFIED = 0;
  AI_LOG_CONTEXT_BUILD = 1;
  AI_LOG_CONTEXT_RUNTIME = 2;
}

// Stored provider configuration; the API key is never echoed back (`has_api_key` reports presence only).
message AiSetting {
  int64 id = 1;
  string name = 2;
  string api_url = 3;
  string model = 4;
  bool is_enabled = 5;
  AiProvider provider = 6;
  bool has_api_key = 7;
  int64 organization_id = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}

message AiEnvironmentVariable {
  string name = 1;
  string value = 2;
}

message AiDomain {
  string host = 1;
  int64 port = 2;
  string service_name = 3;
}

message AiGeneratedFile {
  string file_path = 1;
  // File body as text; config files are plain-text templates.
  string content = 2;
}

// One deployable compose suggestion produced by the model.
message AiComposeSuggestion {
  // Model-issued suggestion identifier; unique within one output.
  string id = 1;
  string name = 2;
  string short_description = 3;
  string description = 4;
  // Docker Compose document (YAML).
  string docker_compose = 5;
  repeated AiEnvironmentVariable env_variables = 6;
  repeated AiDomain domains = 7;
  repeated AiGeneratedFile config_files = 8;
}

// Validated model output: one to three compose suggestions.
message AiGenerationOutput {
  repeated AiComposeSuggestion suggestions = 1;
}

// One generation run: the prompt plus its (reviewable) model output.
message AiGeneration {
  int64 id = 1;
  int64 ai_setting_id = 2;
  int64 organization_id = 3;
  int64 created_by = 4;
  // Natural-language prompt echoed back verbatim.
  string prompt = 5;
  AiGenerationOutput output = 6;
  // Lifecycle status string ("REVIEWED", "DEPLOYING", "DEPLOYED", ...).
  string status = 7;
  // Compose service row created by deployment, once deployed.
  optional int64 compose_id = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}

message AiListSettingsRequest {
  optional int64 organization_id = 1 [(buf.validate.field).int64.gt = 0];
}

message AiListSettingsResponse {
  repeated AiSetting settings = 1;
}

message AiGetSettingsRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional int64 organization_id = 2 [(buf.validate.field).int64.gt = 0];
}

message AiGetSettingsResponse {
  AiSetting setting = 1;
}

message AiCreateSettingsRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 100];
  string api_url = 2 [(buf.validate.field).string.min_len = 1];
  // Secret stored server-side; never echoed back on reads.
  string api_key = 3;
  string model = 4 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 200];
  bool is_enabled = 5;
  optional int64 organization_id = 6 [(buf.validate.field).int64.gt = 0];
}

message AiCreateSettingsResponse {
  AiSetting setting = 1;
}

// An absent `api_key` keeps the stored key.
message AiUpdateSettingsRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional string name = 2 [(buf.validate.field).string.max_len = 100];
  optional string api_url = 3;
  optional string api_key = 4;
  optional string model = 5 [(buf.validate.field).string.max_len = 200];
  optional bool is_enabled = 6;
  optional int64 organization_id = 7 [(buf.validate.field).int64.gt = 0];
}

message AiUpdateSettingsResponse {
  AiSetting setting = 1;
}

message AiDeleteSettingsRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional int64 organization_id = 2 [(buf.validate.field).int64.gt = 0];
}

// Model names offered by the stored provider configuration.
message AiListModelsRequest {
  int64 setting_id = 1 [(buf.validate.field).int64.gt = 0];
  optional int64 organization_id = 2 [(buf.validate.field).int64.gt = 0];
}

message AiListModelsResponse {
  repeated string models = 1;
}

message AiTestSettingsRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional int64 organization_id = 2 [(buf.validate.field).int64.gt = 0];
}

message AiTestSettingsResponse {
  bool success = 1;
  string message = 2;
}

// Model discovery against unsaved credentials (create dialog).
message AiDiscoverModelsRequest {
  string api_url = 1 [(buf.validate.field).string.min_len = 1];
  string api_key = 2;
}

message AiDiscoverModelsResponse {
  repeated string models = 1;
}

// Connectivity test against unsaved credentials.
message AiTestConnectionRequest {
  string api_url = 1 [(buf.validate.field).string.min_len = 1];
  string api_key = 2;
  string model = 3 [(buf.validate.field).string.min_len = 1];
}

message AiTestConnectionResponse {
  bool success = 1;
  string message = 2;
}

message AiListGenerationsRequest {
  optional int64 organization_id = 1 [(buf.validate.field).int64.gt = 0];
  optional int64 limit = 2 [(buf.validate.field).int64 = {gte: 1, lte: 100}];
}

message AiListGenerationsResponse {
  repeated AiGeneration generations = 1;
}

message AiGetGenerationRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional int64 organization_id = 2 [(buf.validate.field).int64.gt = 0];
}

message AiGetGenerationResponse {
  AiGeneration generation = 1;
}

message AiCreateGenerationRequest {
  int64 ai_setting_id = 1 [(buf.validate.field).int64.gt = 0];
  // Free-form natural-language prompt for the compose generation.
  string request = 2 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 8000];
}

message AiCreateGenerationResponse {
  AiGeneration generation = 1;
}

// Full replacement of the generation output after human review.
message AiReviewGenerationRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional int64 organization_id = 2 [(buf.validate.field).int64.gt = 0];
  AiGenerationOutput output = 3;
}

message AiReviewGenerationResponse {
  AiGeneration generation = 1;
}

message AiDeployGenerationRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  optional int64 organization_id = 2 [(buf.validate.field).int64.gt = 0];
  // Selects one suggestion from the reviewed generation output.
  string suggestion_id = 3 [(buf.validate.field).string.min_len = 1];
  int64 environment_id = 4 [(buf.validate.field).int64.gt = 0];
  optional int64 server_id = 5 [(buf.validate.field).int64.gt = 0];
  bool deploy_now = 6;
}

message AiDeployGenerationResponse {
  AiGeneration generation = 1;
  int64 compose_id = 2;
  optional int64 deployment_id = 3;
}

message AiAnalyzeLogsRequest {
  int64 ai_setting_id = 1 [(buf.validate.field).int64.gt = 0];
  AiLogContext context = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  // Raw log corpus sent to the model for analysis.
  string logs = 3 [(buf.validate.field).string.min_len = 1];
}

message AiAnalyzeLogsResponse {
  // Model-authored analysis text (markdown; not structured JSON).
  string analysis = 1;
}

message AiAssistantRequest {
  // Natural-language instruction, e.g. "deploy blinko".
  string prompt = 1 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 8000];
  // Optional provider override; falls back to the org's first enabled setting.
  optional int64 ai_setting_id = 2 [(buf.validate.field).int64.gt = 0];
  // Prior turns of this conversation so the assistant keeps context across
  // messages (e.g. a "yes" that confirms the previous destructive action).
  repeated AiChatTurn history = 3;
  // Opaque JSON carried back from a prior CONFIRM interaction's
  // `pending_actions`; when the user confirms, the server executes these
  // deterministically instead of re-asking the model.
  optional string pending_actions = 4;
  // Server-managed conversation session. Empty on the first message; the
  // server creates a session and returns its id in the first event. On
  // follow-ups, send the session_id back so the server loads history.
  optional string session_id = 5;
}

// One prior conversational turn replayed to the assistant for context.
message AiChatTurn {
  // "user" or "assistant".
  string role = 1 [(buf.validate.field).string.min_len = 1];
  string content = 2;
}

message AiAssistantResponse {
  // Natural-language reply to show the user.
  string reply = 1;
  // Set when the model is asking the user to confirm a destructive action.
  optional string pending_confirmation = 2;
  // Structured interaction the UI should render (Yes/No or option cards)
  // instead of expecting free text back.
  optional AiInteraction interaction = 3;
}

enum AiInteractionKind {
  AI_INTERACTION_KIND_UNSPECIFIED = 0;
  // Yes/No confirmation of a (usually destructive) action.
  AI_INTERACTION_KIND_CONFIRM = 1;
  // Pick one of several options (projects, environments, servers, ...).
  AI_INTERACTION_KIND_CHOICE = 2;
}

message AiInteractionOption {
  // Stable value sent back when chosen (id or canonical name).
  string id = 1;
  string label = 2;
  string description = 3;
}

message AiInteraction {
  AiInteractionKind kind = 1;
  // Question/summary shown above the controls.
  string question = 2;
  // Selectable options (CHOICE only; empty for CONFIRM).
  repeated AiInteractionOption options = 3;
  // CONFIRM only: opaque JSON the client echoes back as the request's
  // `pending_actions` when the user clicks Yes.
  string pending_actions = 4;
}

// Event kind for the streaming assistant.
enum AiAssistantEventKind {
  AI_ASSISTANT_EVENT_KIND_UNSPECIFIED = 0;
  // The model is thinking / processing (show a status line).
  AI_ASSISTANT_EVENT_KIND_THINKING = 1;
  // A tool search / action was started (e.g. "Running deploy…").
  AI_ASSISTANT_EVENT_KIND_STATUS = 2;
  // An action finished and produced a result summary.
  AI_ASSISTANT_EVENT_KIND_ACTION_RESULT = 3;
  // The model's final text reply.
  AI_ASSISTANT_EVENT_KIND_REPLY = 4;
  // A structured confirm / choose interaction.
  AI_ASSISTANT_EVENT_KIND_INTERACTION = 5;
  // Terminal: the turn is complete. session_id is always set here.
  AI_ASSISTANT_EVENT_KIND_DONE = 6;
}

// One live event from the streaming assistant. The web renders each event as
// it arrives: thinking/status as ephemeral progress lines, the reply as the
// final bubble, and the interaction as buttons/cards.
message AiAssistantEvent {
  AiAssistantEventKind kind = 1;
  // Human-readable text for this event (thinking line, status, result, reply).
  string text = 2;
  // Set on INTERACTION events (confirm / choose).
  optional AiInteraction interaction = 3;
  // The server-managed session id. Always present on the first event and on
  // DONE so the client can store it.
  optional string session_id = 4;
}

message AiGetBuildDiagnosisRequest {
  int64 deployment_id = 1 [(buf.validate.field).int64.gt = 0];
  // Recompute the diagnosis even when one is already stored (and bypass the
  // cross-deployment error-signature cache).
  bool force = 2;
}

message AiGetBuildDiagnosisResponse {
  // True when a diagnosis exists for this deployment.
  bool available = 1;
  // "fixable" | "code_error" | "unknown".
  string classification = 2;
  string root_cause = 3;
  string explanation = 4;
  // True when a config-only fix is available (show "Fix with AI").
  bool fixable = 5;
  // What the fix would change: "compose" | "dockerfile" | "env".
  string fix_target = 6;
}

message AiApplyFixRequest {
  int64 deployment_id = 1 [(buf.validate.field).int64.gt = 0];
}

message AiApplyFixResponse {
  bool applied = 1;
  string message = 2;
}
