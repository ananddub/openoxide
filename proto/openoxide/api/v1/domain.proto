syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";

service DomainService {
  rpc ListDomains(ResourceQuery) returns (ResourceListResponse);
  rpc GetDomain(ResourceRequest) returns (ResourceResponse);
  rpc CreateDomain(ResourceRequest) returns (ResourceResponse);
  rpc UpdateDomain(ResourceRequest) returns (ResourceResponse);
  rpc DeleteDomain(ResourceRequest) returns (Empty);
  rpc AttachDomain(ResourceRequest) returns (OperationResult);
  rpc DetachDomain(ResourceRequest) returns (Empty);
}
