syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
import "buf/validate/validate.proto";

service DatabaseService {
  // Get a database by kind (DATABASE_KIND_*) and id.
  rpc GetDatabase(GetDatabaseRequest) returns (Database);
  // List databases of a given kind (DATABASE_KIND_*) within environment_id.
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);
  // Create a database. Required: kind (DATABASE_KIND_*), name, environment_id; image/credentials/port/networks optional.
  rpc CreateDatabase(CreateDatabaseRequest) returns (Database);
  // Update a database by kind and id; absent fields keep stored values (image, credentials, limits, replicas, networks, etc.).
  rpc UpdateDatabase(UpdateDatabaseRequest) returns (Database);
  // Delete a database by kind (DATABASE_KIND_*) and id.
  rpc DeleteDatabase(DeleteDatabaseRequest) returns (Empty);
  // Deploy (create and start) a database by kind and id.
  rpc Deploy(DatabaseOperationRequest) returns (DatabaseOperation);
  // Redeploy a database by kind and id (rebuild/recreate the container/service).
  rpc Redeploy(DatabaseOperationRequest) returns (DatabaseOperation);
  // Reload a database's config/service by kind and id.
  rpc Reload(DatabaseOperationRequest) returns (DatabaseOperation);
  // Start a stopped database by kind and id.
  rpc Start(DatabaseOperationRequest) returns (DatabaseOperation);
  // Stop a running database by kind and id.
  rpc Stop(DatabaseOperationRequest) returns (DatabaseOperation);
  // Cancel an in-progress database operation by kind and id.
  rpc Cancel(DatabaseOperationRequest) returns (Empty);
  // Get Swarm settings for a database by kind and id.
  rpc GetSwarmSettings(SwarmSettingsRequest) returns (SwarmSettings);
  // Update Swarm settings for a database by kind and id with a SwarmSettings payload.
  rpc UpdateSwarmSettings(UpdateSwarmSettingsRequest) returns (SwarmSettings);
  // List mounts for a database by kind and id.
  rpc ListMounts(DatabaseTargetRequest) returns (MountList);
  // Create a mount for a database. Required: kind, database_id, mount_type, mount_path.
  rpc CreateMount(CreateMountRequest) returns (Mount);
  // Update a database mount. Required: kind, database_id, id (mount), mount_type, mount_path.
  rpc UpdateMount(UpdateMountRequest) returns (Mount);
  // Delete a database mount by kind, database_id and id (mount).
  rpc DeleteMount(DeleteMountRequest) returns (Empty);
  // List dependent resources of a database by kind and id.
  rpc ListDependencies(DatabaseTargetRequest) returns (Dependencies);
  // Export a database to an archive by kind and id; include_secrets optionally bundles secrets.
  rpc ExportDatabase(ExportDatabaseRequest) returns (DatabaseExport);
  // Import a database from an archive into environment_id for the given kind.
  rpc ImportDatabase(ImportDatabaseRequest) returns (Database);
  // Get connection details (host, port, database, username) for a database by kind and id.
  rpc GetConnection(DatabaseTargetRequest) returns (DatabaseConnection);
  // Rotate credentials for a database by kind and id.
  rpc RotateCredentials(DatabaseTargetRequest) returns (Database);
  // Validate a database's configuration/connectivity by kind and id.
  rpc ValidateDatabase(DatabaseTargetRequest) returns (ValidationResult);
  // Get advanced Postgres config (replication role, raw config) for a database by kind and id.
  rpc GetPostgresAdvancedConfig(DatabaseTargetRequest) returns (AdvancedConfig);
  // Update advanced Postgres config for a database by kind and id with an AdvancedConfig payload.
  rpc UpdatePostgresAdvancedConfig(UpdateAdvancedConfigRequest) returns (AdvancedConfig);
}
enum DatabaseKind {
  DATABASE_KIND_UNSPECIFIED = 0;
  DATABASE_KIND_POSTGRES = 1;
  DATABASE_KIND_MYSQL = 2;
  DATABASE_KIND_MARIADB = 3;
  DATABASE_KIND_MONGO = 4;
  DATABASE_KIND_REDIS = 5;
  DATABASE_KIND_LIBSQL = 6;
}
message Database {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  string name = 3;
  optional string description = 4;
  string docker_image = 5;
  optional string database_name = 6;
  optional string database_user = 7;
  optional string database_password = 8;
  optional int64 external_port = 9;
  optional string command = 10;
  repeated string args = 11;
  optional string env_var = 12;
  optional string memory_limit = 13;
  optional string cpu_limit = 14;
  int64 replicas = 15;
  repeated string network_ids = 16;
  string status = 17;
  optional string last_error = 18;
  int64 environment_id = 19;
  optional int64 server_id = 20;
  int64 created_at = 21;
  int64 updated_at = 22;
  // Real container/service handle (`postgres-test-1ed127`); `name` is the human label. Log streams and exec target this, never `name`, so same-labeled DBs don't collide.
  optional string app_name = 23;
}
message GetDatabaseRequest {
  DatabaseKind kind = 1;
  int64 id = 2;
}
message ListDatabasesRequest {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 environment_id = 2 [(buf.validate.field).int64.gt = 0];
}
message ListDatabasesResponse {
  repeated Database databases = 1;
}
message CreateDatabaseRequest {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  optional string description = 3;
  int64 environment_id = 4 [(buf.validate.field).int64.gt = 0];
  optional int64 server_id = 5;
  optional string docker_image = 6;
  optional string database_name = 7;
  optional string database_user = 8;
  optional string database_password = 9;
  optional int64 external_port = 10 [(buf.validate.field).int64 = {gte: 1, lte: 65535}];
  repeated string args = 11;
  optional string env_var = 12;
  repeated string network_ids = 13;
}
message UpdateDatabaseRequest {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  optional string name = 3;
  optional string description = 4;
  optional string docker_image = 5;
  optional string database_name = 6;
  optional string database_user = 7;
  optional string database_password = 8;
  optional int64 external_port = 9 [(buf.validate.field).int64 = {gte: 1, lte: 65535}];
  optional string command = 10;
  repeated string args = 11;
  optional string env_var = 12;
  optional string memory_limit = 13;
  optional string cpu_limit = 14;
  optional int64 replicas = 15;
  optional int64 server_id = 16;
  repeated string network_ids = 17;
  optional int64 detach_rustploy_network = 18;
  optional string memory_reservation = 19;
  optional string cpu_reservation = 20;
}
message DeleteDatabaseRequest {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
}
message DatabaseOperationRequest {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
}
message DatabaseOperation {
  Database database = 1;
  string operation = 2;
}
message DatabaseTargetRequest {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
}
message SwarmSettingsRequest {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
}
message SwarmSettings {
  optional string health_check = 1;
  optional string restart_policy = 2;
  optional string placement = 3;
  optional string update_config = 4;
  optional string rollback_config = 5;
  optional string mode = 6;
  optional string labels = 7;
  optional string network = 8;
  optional string endpoint_spec = 9;
  optional string ulimits = 10;
  optional int64 stop_grace_period = 11;
}
message UpdateSwarmSettingsRequest {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  SwarmSettings settings = 3;
}
message Mount {
  int64 id = 1;
  string mount_type = 2;
  optional string host_path = 3;
  optional string volume_name = 4;
  optional string file_path = 5;
  optional string content = 6;
  string mount_path = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}
message MountList {
  repeated Mount mounts = 1;
}
message CreateMountRequest {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 database_id = 2 [(buf.validate.field).int64.gt = 0];
  string mount_type = 3 [(buf.validate.field).string.min_len = 1];
  optional string host_path = 4;
  optional string volume_name = 5;
  optional string file_path = 6;
  optional string content = 7;
  string mount_path = 8 [(buf.validate.field).string.min_len = 1];
}
message UpdateMountRequest {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 database_id = 2 [(buf.validate.field).int64.gt = 0];
  int64 id = 3 [(buf.validate.field).int64.gt = 0];
  string mount_type = 4 [(buf.validate.field).string.min_len = 1];
  optional string host_path = 5;
  optional string volume_name = 6;
  optional string file_path = 7;
  optional string content = 8;
  string mount_path = 9 [(buf.validate.field).string.min_len = 1];
}
message DeleteMountRequest {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 database_id = 2 [(buf.validate.field).int64.gt = 0];
  int64 id = 3 [(buf.validate.field).int64.gt = 0];
}
message Dependencies {
  repeated string items = 1;
}
message ExportDatabaseRequest {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  bool include_secrets = 3;
}
message DatabaseExport {
  string archive = 1;
}
message ImportDatabaseRequest {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 environment_id = 2 [(buf.validate.field).int64.gt = 0];
  string archive = 3 [(buf.validate.field).string = {min_len: 1, max_len: 10485760}];
}
message DatabaseConnection {
  DatabaseKind kind = 1;
  string host = 2;
  int64 port = 3;
  string database = 4;
  string username = 5;
}
message ValidationResult {
  bool valid = 1;
  optional string message = 2;
}
message AdvancedConfig {
  optional string replication_role = 1;
  optional string config = 2;
}
message UpdateAdvancedConfigRequest {
  DatabaseKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  AdvancedConfig config = 3;
}
