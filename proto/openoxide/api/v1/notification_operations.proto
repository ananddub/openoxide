syntax = "proto3";
package openoxide.api.v1;

import "openoxide/api/v1/common.proto";
service NotificationOperationsService {
  rpc ListDeliveryHistory(ResourceQuery) returns (ResourceListResponse);
  rpc CreateBinding(ResourceRequest) returns (ResourceResponse);
  rpc ListBindings(ResourceQuery) returns (ResourceListResponse);
  rpc DeleteBinding(ResourceRequest) returns (Empty);
  rpc ListNotifications(ResourceQuery) returns (ResourceListResponse);
  rpc GetNotification(ResourceRequest) returns (ResourceResponse);
  rpc StreamListDeliveryHistory(ResourceQuery) returns (stream ResourceListResponse);
  rpc StreamListBindings(ResourceQuery) returns (stream ResourceListResponse);
  rpc StreamListNotifications(ResourceQuery) returns (stream ResourceListResponse);
  rpc StreamNotification(ResourceRequest) returns (stream ResourceResponse);
  rpc CreateNotification(ResourceRequest) returns (ResourceResponse);
  rpc UpdateNotification(ResourceRequest) returns (ResourceResponse);
  rpc ReplaceNotification(ResourceRequest) returns (ResourceResponse);
  rpc DeleteNotification(ResourceRequest) returns (Empty);
  rpc TestNotification(ResourceRequest) returns (OperationResult);
}
