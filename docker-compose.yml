services:
  openoxide:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${OPENOXIDE_IMAGE:-dubeyanand/openoxide}:${OPENOXIDE_TAG:-latest}
    pull_policy: always
    container_name: openoxide
    restart: unless-stopped

    ports:
      - "4000:4000"
      - "51820:51820/udp"

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      # Panel database + runtime data (backups, logs, traefik config, etc.)
      - openoxide_data:/app/data
      # Docker socket — panel drives the local Docker daemon for deployments
      - /var/run/docker.sock:/var/run/docker.sock
      # Containerd sockets (Direct containerd gRPC socket stream)
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock
      - /run/docker/containerd/containerd.sock:/run/docker/containerd/containerd.sock
      # Host Kernel Modules (Required for WireGuard interface creation)
      - /lib/modules:/lib/modules:ro

    environment:
      PORT: "4000"
      HOST: "0.0.0.0"
      DATABASE_URL: "sqlite:///app/data/db.sqlite3"
      MALLOC_ARENA_MAX: "2"
      RUST_BACKTRACE: "1"

      # ── Secrets — override all of these before going to production ─────────
      SECRET_KEY: "change_me_in_production"
      JWT_ACCESS_SECRET: "change_me_jwt_access"
      JWT_REFRESH_SECRET: "change_me_jwt_refresh"

      # Shared secret between panel and monitoring agents.
      # Empty string disables agent ingestion entirely.
      METRICS_TOKEN: "change_me_metrics_token"
      # Server row used by the local monitor. Keep this aligned with the
      # SERVER_ID configured in docker-compose.monitor.yml.
      OPENOXIDE_LOCAL_SERVER_ID: "${OPENOXIDE_LOCAL_SERVER_ID:-0}"
      OPENOXIDE_SERVER_URL: "http://openoxide:4000"

      # ── Public URLs ────────────────────────────────────────────────────────
      # Used in password-reset / email-verification links sent to users.
      # OPENOXIDE_PUBLIC_URL: "https://panel.example.com"
      # URL agents and remote-server setup use to reach this panel.
      # OPENOXIDE_SERVER_URL: "http://YOUR_HOST_IP:4000"

      # ── Docker ────────────────────────────────────────────────────────────
      SOCKET_PATH: "/var/run/docker.sock"

      # ── Build resource limits (applied per deployment) ────────────────────
      BUILD_MEMORY_LIMIT: "8G"
      BUILD_CPU_LIMIT: "8"

      # ── Runtime Performance & Memory Optimization ──────────────────────────
      TOKIO_WORKER_THREADS: "4"

      # ── Logging ───────────────────────────────────────────────────────────
      RUST_LOG: "openoxide=info"

    networks:
      - openoxide-network

    # Give the panel enough room; tune down if the host is constrained.
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  openoxide_data:

networks:
  openoxide-network:
    external: true
